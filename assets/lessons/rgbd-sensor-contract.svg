<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description"><title id="title">深度像素的针孔反投影</title><desc id='description'>像素比主点向右 100 像素，焦距 500 像素、深度两米时，空间点横向偏移 0.4 米。</desc><defs><pattern id="dots" patternUnits="userSpaceOnUse" width="22" height="22"><circle cx="2" cy="2" r="1.2" fill="#cdd6e2" opacity=".64"/></pattern></defs><rect width="640" height="360" fill="#f5f8fc"/><rect width="640" height="360" fill="url(#dots)"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#182642"><text x='40' y='54' text-anchor='start' font-size='28' font-weight='550' fill='#182642'>一个像素对应一条射线</text><path d='M 91 240 L 572 240' fill='none' stroke='#182642' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><path d='M 572 240 L 562.347 245.274' fill='none' stroke='#182642' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><path d='M 572 240 L 562.347 234.726' fill='none' stroke='#182642' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><text x='585' y='246' text-anchor='middle' font-size='23' font-weight='550' fill='#182642'>Z</text><path d='M 198 113 L 198 281' fill='none' stroke='#345ac8' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/><path d='M74 219 L96 239 L74 258 H50 V219 Z' fill='#dce8fc' stroke='#345ac8' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><path d='M 94 239 L 493 112' fill='none' stroke='#087d82' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/><path d='M 493 112 L 493 240' fill='none' stroke='#7850bc' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='6 6'/><circle cx='493' cy='112' r='8' fill='#e9dff8' stroke='#7850bc' stroke-width='2.5'/><circle cx='198' cy='206' r='7' fill='#dce8fc' stroke='#345ac8' stroke-width='2.5'/><text x='181' y='101' text-anchor='middle' font-size='22' font-weight='550' fill='#345ac8'>像平面</text><text x='508' y='96' text-anchor='middle' font-size='22' font-weight='550' fill='#7850bc'>空间点</text><text x='535' y='184' text-anchor='middle' font-size='22' font-weight='550' fill='#7850bc'>0.4 m</text><path d='M 96 277 L 493 277' fill='none' stroke='#182642' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path d='M 96 270 L 96 284' fill='none' stroke='#182642' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path d='M 493 270 L 493 284' fill='none' stroke='#182642' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><text x='294' y='311' text-anchor='middle' font-size='24' font-weight='550' fill='#182642'>Z = 2 m</text><text x='266' y='191' text-anchor='middle' font-size='19' font-weight='550' fill='#087d82'>+100 px</text></g></svg>
