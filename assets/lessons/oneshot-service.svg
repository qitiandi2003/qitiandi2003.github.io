<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description"><title id="title">一次性服务的时间线</title><desc id='description'>启动命令只运行一段时间，随后 active (exited) 和它留下的结果可以继续存在。</desc><defs><pattern id="dots" patternUnits="userSpaceOnUse" width="22" height="22"><circle cx="2" cy="2" r="1.2" fill="#cdd6e2" opacity=".64"/></pattern></defs><rect width="640" height="360" fill="#f5f8fc"/><rect width="640" height="360" fill="url(#dots)"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#182642"><text x='38' y='54' text-anchor='start' font-size='27' font-weight='550' fill='#182642'>Type=oneshot</text><text x='603' y='54' text-anchor='end' font-size='20' font-weight='550' fill='#7850bc'>RemainAfterExit=yes</text><path d='M 330 77 L 330 280' fill='none' stroke='#c9d5df' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='6 6'/><text x='40' y='128' text-anchor='start' font-size='22' font-weight='550' fill='#182642'>启动进程</text><rect x='175' y='105' width='155' height='32' rx='7' fill='#dce8fc' stroke='#345ac8' stroke-width='2.4'/><text x='252' y='128' text-anchor='middle' font-size='19' font-weight='550' fill='#345ac8'>运行</text><circle cx='330' cy='121' r='6' fill='#fff' stroke='#345ac8' stroke-width='2.5'/><text x='40' y='193' text-anchor='start' font-size='22' font-weight='550' fill='#182642'>服务状态</text><rect x='175' y='165' width='155' height='37' rx='7' fill='#e9dff8' stroke='#7850bc' stroke-width='2.4'/><text x='252' y='191' text-anchor='middle' font-size='20' font-weight='550' fill='#7850bc'>启动中</text><rect x='330' y='165' width='242' height='37' rx='7' fill='#c9eaea' stroke='#087d82' stroke-width='2.4'/><text x='451' y='191' text-anchor='middle' font-size='21' font-weight='550' fill='#087d82'>active (exited)</text><text x='40' y='252' text-anchor='start' font-size='22' font-weight='550' fill='#182642'>产出文件</text><path d='M 330 245 L 573 245' fill='none' stroke='#087d82' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><path d='M 573 245 L 563.347 250.274' fill='none' stroke='#087d82' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><path d='M 573 245 L 563.347 239.726' fill='none' stroke='#087d82' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><g transform='translate(338 219) scale(0.54)'><path d='M0 0 H43 L58 15 V75 H0 Z' fill='#c9eaea' stroke='#087d82' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/><path d='M43 0 V15 H58 M11 33 H44 M11 45 H38 M11 57 H30' fill='none' stroke='#087d82' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/></g><path d='M 175 291 L 586 291' fill='none' stroke='#182642' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><path d='M 586 291 L 576.347 296.274' fill='none' stroke='#182642' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><path d='M 586 291 L 576.347 285.726' fill='none' stroke='#182642' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><text x='175' y='323' text-anchor='middle' font-size='20' font-weight='550' fill='#182642'>开始</text><text x='330' y='323' text-anchor='middle' font-size='20' font-weight='550' fill='#182642'>退出 0</text><text x='581' y='323' text-anchor='middle' font-size='20' font-weight='550' fill='#182642'>时间</text></g></svg>
