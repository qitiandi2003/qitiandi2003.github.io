<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>启动后才有节点</title><desc id='desc'>两个可执行程序分别启动一个进程；仿真进程内是 /turtlesim，键盘进程内是 /teleop_turtle。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><rect x='28.0' y='28.0' width='584.0' height='112.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='48.0' y='62.0' font-size='28' fill='#0071e3' text-anchor='start'>磁盘里的 turtlesim 包</text><rect x='48.0' y='83.0' width='250.0' height='40.0' rx='8' fill='#ffffff' stroke='none' stroke-width='2'/><text x='173.0' y='111.0' font-size='24' fill='#1d1d1f' text-anchor='middle'>turtlesim_node</text><rect x='320.0' y='83.0' width='272.0' height='40.0' rx='8' fill='#ffffff' stroke='none' stroke-width='2'/><text x='456.0' y='111.0' font-size='24' fill='#1d1d1f' text-anchor='middle'>turtle_teleop_key</text><line x1='173.0' y1='140.0' x2='173.0' y2='184.0' stroke='#0071e3' stroke-width='3'/><path d='M 173 184 L 168.05 173 L 177.95 173 Z' fill='#0071e3'/><line x1='456.0' y1='140.0' x2='456.0' y2='184.0' stroke='#0071e3' stroke-width='3'/><path d='M 456 184 L 451.05 173 L 460.95 173 Z' fill='#0071e3'/><rect x='48.0' y='192.0' width='250.0' height='123.0' rx='8' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><rect x='320.0' y='192.0' width='272.0' height='123.0' rx='8' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><text x='173.0' y='223.0' font-size='26' fill='#6e6e73' text-anchor='middle'>仿真进程</text><text x='456.0' y='223.0' font-size='26' fill='#6e6e73' text-anchor='middle'>键盘进程</text><rect x='65.0' y='242.0' width='216.0' height='48.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><rect x='334.0' y='242.0' width='244.0' height='48.0' rx='8' fill='#e9f5ef' stroke='none' stroke-width='2'/><text x='173.0' y='274.0' font-size='25' fill='#0071e3' text-anchor