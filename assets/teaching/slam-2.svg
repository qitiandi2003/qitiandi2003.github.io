<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>第二条射线交会</title><desc id='desc'>相机 A、B 的两条观察射线交于同一静止路标，相机间距是基线。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>一次观察是一条射线</text><line x1='70.0' y1='280.0' x2='450.0' y2='280.0' stroke='#d2d2d7' stroke-width='3'/><text x='90.0' y='325.0' font-size='26' fill='#1d1d1f' text-anchor='start'>相机 A</text><circle cx='130.0' cy='280.0' r='11.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='600.0' y='326.0' font-size='22' fill='#6e6e73' text-anchor='end'>俯视示意</text><line x1='130.0' y1='280.0' x2='330.0' y2='80.0' stroke='#0071e3' stroke-width='3'/><path d='M 330 80 L 325.722 91.2784 L 318.722 84.278 Z' fill='#0071e3'/><line x1='390.0' y1='280.0' x2='330.0' y2='80.0' stroke='#267652' stroke-width='3'/><path d='M 330 80 L 337.902 89.1137 L 328.42 91.9585 Z' fill='#267652'/><circle cx='330.0' cy='80.0' r='10.0' fill='#b05a15' stroke='none' stroke-width='3'/><circle cx='390.0' cy='280.0' r='11.0' fill='#267652' stroke='none' stroke-width='3'/><text x='350.0' y='325.0' font-size='26' fill='#267652' text-anchor='start'>相机 B</text><text x='350.0' y='95.0' font-size='26' fill='#1d1d1f' text-anchor='start'>同一路标</text><line x1='130.0' y1='300.0' x2='390.0' y2='300.0' stroke='#6e6e73' stroke-width='2'/><text x='260.0' y='277.0' font-size='26' fill='#6e6e73' text-anchor='middle'>基线</text></g></svg>
