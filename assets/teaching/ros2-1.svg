<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>先找到可执行程序</title><desc id='desc'>磁盘上的 turtlesim 包里并列存放 turtlesim_node 和 turtle_teleop_key，尚未启动进程。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><rect x='28.0' y='28.0' width='584.0' height='112.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='48.0' y='62.0' font-size='28' fill='#0071e3' text-anchor='start'>磁盘里的 turtlesim 包</text><rect x='48.0' y='83.0' width='250.0' height='40.0' rx='8' fill='#ffffff' stroke='none' stroke-width='2'/><text x='173.0' y='111.0' font-size='24' fill='#1d1d1f' text-anchor='middle'>turtlesim_node</text><rect x='320.0' y='83.0' width='272.0' height='40.0' rx='8' fill='#ffffff' stroke='none' stroke-width='2'/><text x='456.0' y='111.0' font-size='24' fill='#1d1d1f' text-anchor='middle'>turtle_teleop_key</text><text x='320.0' y='213.0' font-size='32' fill='#1d1d1f' text-anchor='middle' font-weight='600'>已安装 ≠ 已运行</text><text x='320.0' y='273.0' font-size='28' fill='#6e6e73' text-anchor='middle'>包名回答“到哪里找”</text></g></svg>
