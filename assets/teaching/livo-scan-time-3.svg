<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>先到世界，再回参考系</title><desc id='desc'>两个采样点都换到结束时刻的雷达坐标，最终距离同为4.80米。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>把两个时刻的点搬到同一原点</text><line x1='75.0' y1='135.0' x2='540.0' y2='135.0' stroke='#d2d2d7' stroke-width='2'/><line x1='75.0' y1='235.0' x2='540.0' y2='235.0' stroke='#d2d2d7' stroke-width='2'/><line x1='540.0' y1='85.0' x2='540.0' y2='267.0' stroke='#1d1d1f' stroke-width='7'/><text x='558.0' y='185.0' font-size='28' fill='#1d1d1f' text-anchor='start'>墙</text><text x='35.0' y='109.0' font-size='25' fill='#0071e3' text-anchor='start'>开始</text><text x='35.0' y='209.0' font-size='25' fill='#b05a15' text-anchor='start'>结束</text><circle cx='108.0' cy='235.0' r='11.0' fill='#b05a15' stroke='none' stroke-width='3'/><circle cx='540.0' cy='135.0' r='10.0' fill='#ffffff' stroke='#0071e3' stroke-width='3'/><circle cx='540.0' cy='235.0' r='8.0' fill='#b05a15' stroke='none' stroke-width='3'/><line x1='540.0' y1='135.0' x2='540.0' y2='235.0' stroke='#267652' stroke-width='3'/><text x='310.0' y='121.0' font-size='27' fill='#0071e3' text-anchor='middle'>5.00 − 0.20 = 4.80</text><text x='310.0' y='220.0' font-size='27' fill='#b05a15' text-anchor='middle'>4.80 − 0 = 4.80</text><text x='320.0' y='321.0' font-size='28' fill='#267652' text-anchor='middle'>统一到扫描结束时刻</text></g></svg>
