<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>原图的像素单位</title><desc id='desc'>原图焦距 600 像素，左右列号为 350、320，视差 30，深度为 2 米。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='35.0' y='40.0' font-size='28' fill='#1d1d1f' text-anchor='start'>缩图时，像素焦距也要一起缩</text><text x='130.0' y='100.0' font-size='28' fill='#0071e3' text-anchor='middle'>左图</text><text x='470.0' y='100.0' font-size='28' fill='#b05a15' text-anchor='middle'>右图</text><rect x='35.0' y='120.0' width='250.0' height='130.0' rx='8' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><rect x='355.0' y='120.0' width='250.0' height='130.0' rx='8' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><line x1='200.0' y1='140.0' x2='200.0' y2='180.0' stroke='#0071e3' stroke-width='5'/><line x1='490.0' y1='140.0' x2='490.0' y2='180.0' stroke='#b05a15' stroke-width='5'/><text x='200.0' y='218.0' font-size='28' fill='#0071e3' text-anchor='middle'>350</text><text x='490.0' y='218.0' font-size='28' fill='#b05a15' text-anchor='middle'>320</text><text x='320.0' y='292.0' font-size='30' fill='#1d1d1f' text-anchor='middle'>600 × 0.10 ÷ 30</text><text x='320.0' y='337.0' font-size='30' fill='#267652' text-anchor='middle'>2.00 m</text></g></svg>
