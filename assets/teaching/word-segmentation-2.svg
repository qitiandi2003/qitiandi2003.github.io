<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>补上第二个词的权重</title><desc id='desc'>路线 A 前两词权重乘积为 600，路线 B 为 200，共同末词起源暂时省略。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='35.0' y='38.0' font-size='28' fill='#1d1d1f' text-anchor='start'>把局部选择放回整句比较</text><text x='320.0' y='104.0' font-size='32' fill='#1d1d1f' text-anchor='middle'>研究生命起源</text><text x='45.0' y='185.0' font-size='26' fill='#0071e3' text-anchor='start'>路线 A</text><text x='45.0' y='268.0' font-size='26' fill='#b05a15' text-anchor='start'>路线 B</text><rect x='174.0' y='149.0' width='112.0' height='53.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><rect x='302.0' y='149.0' width='112.0' height='53.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><rect x='430.0' y='149.0' width='112.0' height='53.0' rx='8' fill='#f5f5f7' stroke='none' stroke-width='2'/><text x='230.0' y='185.0' font-size='28' fill='#0071e3' text-anchor='middle'>研究</text><text x='358.0' y='185.0' font-size='28' fill='#0071e3' text-anchor='middle'>生命</text><text x='486.0' y='185.0' font-size='28' fill='#6e6e73' text-anchor='middle'>起源</text><rect x='174.0' y='232.0' width='160.0' height='53.0' rx='8' fill='#fff2e4' stroke='none' stroke-width='2'/><rect x='350.0' y='232.0' width='64.0' height='53.0' rx='8' fill='#fff2e4' stroke='none' stroke-width='2'/><rect x='430.0' y='232.0' width='112.0' height='53.0' rx='8' fill='#f5f5f7' stroke='none' stroke-width='2'/><text x='254.0' y='268.0' font-size='28' fill='#b05a15' text-anchor='middle'>研究生</text><text x='382.0' y='268.0' font-size='28' fill='#b05a15' text-anchor='middle'>命</text><text x='486.0' y='268.0' font-size='28' fill='#6e6e73' text-anchor='middle'>起源</text><text x='230.0' y='139.0' font-size='24' fill='#0071e3' text-anchor='middle'>20</text><text x='358.0' y='139.0' font-size='24' fill='#0071e3' text-anchor='middle'>30</text><text x='254.0' y='222.0' font-size='24' fill='#b05a15' text-anchor='middle'>40</text><text x='382.0' y='222.0' font-size='24' fill='#b05a15' text-anchor='middle'>5</text><text x='320.0' y='337.0' font-size='26' fill='#0071e3' text-anchor='middle'>20 × 30 = 600 &gt; 40 × 5 = 200</text></g></svg>
