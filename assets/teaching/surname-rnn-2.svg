<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>识别一个常见错法</title><desc id='desc'>错误配对把开始、L、i 同时作为输入和目标，训练任务变成复制当前位置。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='35.0' y='40.0' font-size='28' fill='#1d1d1f' text-anchor='start'>生成任务，每一步预测下一个字符</text><text x='35.0' y='111.0' font-size='27' fill='#0071e3' text-anchor='start'>输入</text><text x='35.0' y='242.0' font-size='27' fill='#b52d39' text-anchor='start'>错误目标</text><rect x='145.0' y='76.0' width='120.0' height='60.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='205.0' y='116.0' font-size='30' fill='#0071e3' text-anchor='middle'>开始</text><rect x='145.0' y='207.0' width='120.0' height='60.0' rx='8' fill='#fff2e4' stroke='none' stroke-width='2'/><text x='205.0' y='247.0' font-size='30' fill='#b52d39' text-anchor='middle'>开始</text><line x1='205.0' y1='145.0' x2='205.0' y2='197.0' stroke='#b52d39' stroke-width='3'/><path d='M 205 197 L 200.05 186 L 209.95 186 Z' fill='#b52d39'/><rect x='300.0' y='76.0' width='120.0' height='60.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='360.0' y='116.0' font-size='30' fill='#0071e3' text-anchor='middle'>L</text><rect x='300.0' y='207.0' width='120.0' height='60.0' rx='8' fill='#fff2e4' stroke='none' stroke-width='2'/><text x='360.0' y='247.0' font-size='30' fill='#b52d39' text-anchor='middle'>L</text><line x1='360.0' y1='145.0' x2='360.0' y2='197.0' stroke='#b52d39' stroke-width='3'/><path d='M 360 197 L 355.05 186 L 364.95 186 Z' fill='#b52d39'/><rect x='455.0' y='76.0' width='120.0' height='60.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='515.0' y='116.0' font-size='30' fill='#0071e3' text-anchor='middle'>i</text><rect x='455.0' y='207.0' width='120.0' height='60.0' rx='8' fill='#fff2e4' stroke='none' stroke-width='2'/><text x='515.0' y='247.0' font-size='30' fill='#b52d39' text-anchor='middle'>i</text><line x1='515.0' y1='145.0' x2='515.0' y2='197.0' stroke='#b52d39' stroke-width='3'/><path d='M 515 197 L 510.05 186 L 519.95 186 Z' fill='#b52d39'/><text x='320.0' y='325.0' font-size='28' fill='#b52d39' text-anchor='middle'>这是复制，未必学会续写</text></g></svg>
