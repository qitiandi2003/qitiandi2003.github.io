<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>把图形换成一个数</title><desc id='desc'>600 像素乘 0.10 米除以 30 像素，得到深度 2 米。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>一次观察是一条射线</text><line x1='70.0' y1='280.0' x2='450.0' y2='280.0' stroke='#d2d2d7' stroke-width='3'/><text x='90.0' y='325.0' font-size='26' fill='#1d1d1f' text-anchor='start'>相机 A</text><circle cx='130.0' cy='280.0' r='11.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='600.0' y='326.0' font-size='22' fill='#6e6e73' text-anchor='end'>俯视示意</text><rect x='55.0' y='72.0' width='530.0' height='184.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='320.0' y='119.0' font-size='28' fill='#0071e3' text-anchor='middle'>焦距 600 px · 基线 0.10 m</text><text x='320.0' y='173.0' font-size='32' fill='#1d1d1f' text-anchor='middle' font-weight='600'>视差 30 px</text><text x='320.0' y='224.0' font-size='26' fill='#1d1d1f' text-anchor='middle'>深度 = 600 × 0.10 ÷ 30 = 2 m</text></g></svg>
