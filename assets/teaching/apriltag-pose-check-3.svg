<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>再用独立的尺核对</title><desc id='desc'>外部尺测为 1 米，错误估计多出 0.25 米，即 25%；修正检测边长后复核其他位置。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='35.0' y='40.0' font-size='30' fill='#1d1d1f' text-anchor='start'>一张照片，同一个像宽</text><rect x='45.0' y='80.0' width='205.0' height='200.0' rx='8' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><rect x='100.0' y='130.0' width='95.0' height='95.0' rx='0' fill='#ffffff' stroke='#1d1d1f' stroke-width='2'/><rect x='110.0' y='140.0' width='75.0' height='75.0' rx='0' fill='#1d1d1f' stroke='none' stroke-width='2'/><rect x='126.0' y='156.0' width='43.0' height='43.0' rx='0' fill='#ffffff' stroke='none' stroke-width='2'/><line x1='100.0' y1='244.0' x2='195.0' y2='244.0' stroke='#0071e3' stroke-width='3'/><text x='148.0' y='278.0' font-size='28' fill='#0071e3' text-anchor='middle'>72 px</text><text x='355.0' y='90.0' font-size='28' fill='#1d1d1f' text-anchor='start'>焦距 600 px</text><text x='355.0' y='152.0' font-size='28' fill='#267652' text-anchor='start'>尺测 1.00 m</text><text x='355.0' y='209.0' font-size='30' fill='#b52d39' text-anchor='start' font-weight='600'>偏长 25%</text><text x='355.0' y='278.0' font-size='26' fill='#1d1d1f' text-anchor='start'>先查真实边长</text></g></svg>
