<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>一份位移含两个方向</title><desc id='desc'>测点相比参考点沿墙偏移30厘米、法向偏移4厘米。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>先把误差拆成法向与切向</text><line x1='275.0' y1='75.0' x2='275.0' y2='290.0' stroke='#0071e3' stroke-width='7'/><text x='128.0' y='100.0' font-size='26' fill='#0071e3' text-anchor='start'>墙面 x = 2 m</text><circle cx='275.0' cy='255.0' r='9.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='65.0' y='290.0' font-size='25' fill='#0071e3' text-anchor='start'>参考点 (2, 1)</text><line x1='275.0' y1='255.0' x2='369.0' y2='255.0' stroke='#6e6e73' stroke-width='2'/><path d='M 369 255 L 358 259.95 L 358 250.05 Z' fill='#6e6e73'/><text x='373.0' y='264.0' font-size='25' fill='#6e6e73' text-anchor='start'>法向</text><circle cx='287.0' cy='165.0' r='10.0' fill='#b05a15' stroke='none' stroke-width='3'/><line x1='275.0' y1='255.0' x2='275.0' y2='165.0' stroke='#267652' stroke-width='4'/><line x1='275.0' y1='165.0' x2='287.0' y2='165.0' stroke='#b05a15' stroke-width='5'/><text x='305.0' y='157.0' font-size='26' fill='#b05a15' text-anchor='start'>测点</text><text x='305.0' y='201.0' font-size='25' fill='#b05a15' text-anchor='start'>(2.04, 1.30)</text><text x='440.0' y='106.0' font-size='26' fill='#267652' text-anchor='start'>沿墙 30 cm</text><text x='440.0' y='148.0' font-size='26' fill='#b05a15' text-anchor='start'>离墙 4 cm</text><text x='320.0' y='335.0' font-size='23' fill='#6e6e73' text-anchor='middle'>图中两方向使用相同长度比例</text></g></svg>
