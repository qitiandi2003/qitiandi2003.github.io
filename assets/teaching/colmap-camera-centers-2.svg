<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>利用镜头自己的原点</title><desc id='desc'>相机中心满足 0=RC+t，应先减去平移再逆旋转。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>先问：谁在谁的坐标里？</text><line x1='100.0' y1='260.0' x2='340.0' y2='260.0' stroke='#0071e3' stroke-width='3'/><path d='M 340 260 L 329 264.95 L 329 255.05 Z' fill='#0071e3'/><line x1='100.0' y1='260.0' x2='100.0' y2='70.0' stroke='#0071e3' stroke-width='3'/><path d='M 100 70 L 104.95 81 L 95.05 81 Z' fill='#0071e3'/><text x='342.0' y='290.0' font-size='23' fill='#0071e3' text-anchor='start'>世界 x</text><text x='112.0' y='76.0' font-size='23' fill='#0071e3' text-anchor='start'>世界 y</text><circle cx='100.0' cy='260.0' r='6.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='68.0' y='291.0' font-size='26' fill='#0071e3' text-anchor='start'>O</text><circle cx='270.0' cy='175.0' r='10.0' fill='#b05a15' stroke='none' stroke-width='3'/><line x1='270.0' y1='175.0' x2='270.0' y2='235.0' stroke='#b05a15' stroke-width='3'/><path d='M 270 235 L 265.05 224 L 274.95 224 Z' fill='#b05a15'/><line x1='270.0' y1='175.0' x2='335.0' y2='175.0' stroke='#b05a15' stroke-width='3'/><path d='M 335 175 L 324 179.95 L 324 170.05 Z' fill='#b05a15'/><text x='281.0' y='239.0' font-size='24' fill='#b05a15' text-anchor='start'>xᶜ</text><text x='341.0' y='181.0' font-size='24' fill='#b05a15' text-anchor='start'>yᶜ</text><text x='285.0' y='146.0' font-size='28' fill='#b05a15' text-anchor='start'>C = ?</text><text x='390.0' y='112.0' font-size='28' fill='#1d1d1f' text-anchor='start'>镜头看自己</text><text x='390.0' y='156.0' font-size='26' fill='#1d1d1f' text-anchor='start'>坐标必为零</text><text x='390.0' y='210.0' font-size='27' fill='#0071e3' text-anchor='start'>0 = R C + t</text><text x='320.0' y='335.0' font-size='26' fill='#6e6e73' text-anchor='middle'>减去 t，再做逆旋转</text></g></svg>
