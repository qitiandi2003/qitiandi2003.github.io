<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>推理时自己接着写</title><desc id='desc'>生成路径从开始到 L，再到 i，最后到结束；每次预测会成为下一步输入。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='35.0' y='40.0' font-size='28' fill='#1d1d1f' text-anchor='start'>生成任务，每一步预测下一个字符</text><rect x='36.0' y='150.0' width='113.0' height='70.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='92.0' y='196.0' font-size='30' fill='#0071e3' text-anchor='middle'>开始</text><line x1='153.0' y1='185.0' x2='179.0' y2='185.0' stroke='#0071e3' stroke-width='3'/><path d='M 179 185 L 168 189.95 L 168 180.05 Z' fill='#0071e3'/><rect x='187.0' y='150.0' width='113.0' height='70.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='243.0' y='196.0' font-size='30' fill='#0071e3' text-anchor='middle'>L</text><line x1='304.0' y1='185.0' x2='330.0' y2='185.0' stroke='#0071e3' stroke-width='3'/><path d='M 330 185 L 319 189.95 L 319 180.05 Z' fill='#0071e3'/><rect x='338.0' y='150.0' width='113.0' height='70.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='394.0' y='196.0' font-size='30' fill='#0071e3' text-anchor='middle'>i</text><line x1='455.0' y1='185.0' x2='481.0' y2='185.0' stroke='#0071e3' stroke-width='3'/><path d='M 481 185 L 470 189.95 L 470 180.05 Z' fill='#0071e3'/><rect x='489.0' y='150.0' width='113.0' height='70.0' rx='8' fill='#e9f5ef' stroke='none' stroke-width='2'/><text x='545.0' y='196.0' font-size='30' fill='#267652' text-anchor='middle'>结束</text><text x='320.0' y='114.0' font-size='28' fill='#1d1d1f' text-anchor='middle'>预测结果成为下一步输入</text><text x='320.0' y='289.0' font-size='27' fill='#6e6e73' text-anchor='middle'>没有标准答案在旁边提示</text></g></svg>
