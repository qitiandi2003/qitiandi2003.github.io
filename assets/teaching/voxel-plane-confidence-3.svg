<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>把残差放进噪声尺度</title><desc id='desc'>4厘米残差分别除以1和8厘米标准差，得到4与0.5。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>先把误差拆成法向与切向</text><line x1='275.0' y1='75.0' x2='275.0' y2='290.0' stroke='#0071e3' stroke-width='7'/><text x='128.0' y='100.0' font-size='26' fill='#0071e3' text-anchor='start'>墙面 x = 2 m</text><circle cx='275.0' cy='255.0' r='9.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='65.0' y='290.0' font-size='25' fill='#0071e3' text-anchor='start'>参考点 (2, 1)</text><line x1='275.0' y1='255.0' x2='369.0' y2='255.0' stroke='#6e6e73' stroke-width='2'/><path d='M 369 255 L 358 259.95 L 358 250.05 Z' fill='#6e6e73'/><text x='373.0' y='264.0' font-size='25' fill='#6e6e73' text-anchor='start'>法向</text><circle cx='287.0' cy='165.0' r='10.0' fill='#b05a15' stroke='none' stroke-width='3'/><text x='420.0' y='101.0' font-size='28' fill='#b05a15' text-anchor='start'>相同 4 cm</text><text x='420.0' y='157.0' font-size='26' fill='#1d1d1f' text-anchor='start'>σ = 1 cm</text><text x='420.0' y='195.0' font-size='27' fill='#b52d39' text-anchor='start'>r / σ = 4</text><text x='420.0' y='245.0' font-size='26' fill='#1d1d1f' text-anchor='start'>σ = 8 cm</text><text x='420.0' y='285.0' font-size='27' fill='#267652' text-anchor='start'>r / σ = 0.5</text><text x='320.0' y='335.0' font-size='25' fill='#1d1d1f' text-anchor='middle'>残差大小要结合预计噪声理解</text></g></svg>
