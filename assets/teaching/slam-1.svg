<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>一个方向，很多距离</title><desc id='desc'>相机 A 的同一射线上有近、远两个候选点。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>一次观察是一条射线</text><line x1='70.0' y1='280.0' x2='450.0' y2='280.0' stroke='#d2d2d7' stroke-width='3'/><text x='90.0' y='325.0' font-size='26' fill='#1d1d1f' text-anchor='start'>相机 A</text><circle cx='130.0' cy='280.0' r='11.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='600.0' y='326.0' font-size='22' fill='#6e6e73' text-anchor='end'>俯视示意</text><line x1='130.0' y1='280.0' x2='355.0' y2='55.0' stroke='#0071e3' stroke-width='3'/><path d='M 355 55 L 350.722 66.2784 L 343.722 59.278 Z' fill='#0071e3'/><circle cx='230.0' cy='180.0' r='9.0' fill='#b05a15' stroke='none' stroke-width='3'/><circle cx='330.0' cy='80.0' r='9.0' fill='#b05a15' stroke='none' stroke-width='3'/><text x='255.0' y='188.0' font-size='26' fill='#b05a15' text-anchor='start'>近？</text><text x='353.0' y='89.0' font-size='26' fill='#b05a15' text-anchor='start'>远？</text></g></svg>
