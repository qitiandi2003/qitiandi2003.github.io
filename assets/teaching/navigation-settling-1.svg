<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>进圈只通过位置条件</title><desc id='desc'>机器人到目标的横纵误差分别为 0.06 与 0.08 米，距离为 0.10 米，在 0.12 米容差圈内。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><circle cx='360.0' cy='217.0' r='96.0' fill='#e9f5ef' stroke='#267652' stroke-width='3'/><circle cx='360.0' cy='217.0' r='7.0' fill='#267652' stroke='none' stroke-width='3'/><text x='360.0' y='86.0' font-size='27' fill='#267652' text-anchor='middle'>目标 (2.00, 1.00)</text><line x1='360.0' y1='217.0' x2='312.0' y2='217.0' stroke='#d2d2d7' stroke-width='2' stroke-dasharray='7 6'/><line x1='312.0' y1='217.0' x2='312.0' y2='153.0' stroke='#d2d2d7' stroke-width='2' stroke-dasharray='7 6'/><text x='336.0' y='246.0' font-size='23' fill='#6e6e73' text-anchor='middle'>0.06 m</text><text x='297.0' y='188.0' font-size='23' fill='#6e6e73' text-anchor='end'>0.08 m</text><text x='473.0' y='271.0' font-size='24' fill='#267652' text-anchor='start'>容差</text><text x='473.0' y='303.0' font-size='25' fill='#267652' text-anchor='start'>0.12 m</text><circle cx='312.0' cy='153.0' r='11.0' fill='#0071e3' stroke='none' stroke-width='3'/><line x1='312.0' y1='153.0' x2='360.0' y2='217.0' stroke='#0071e3' stroke-width='3'/><text x='125.0' y='77.0' font-size='30' fill='#0071e3' text-anchor='middle' font-weight='600'>距离合格</text><text x='140.0' y='121.0' font-size='24' fill='#0071e3' text-anchor='middle'>√(0.06² + 0.08²)</text><text x='140.0' y='156.0' font-size='28' fill='#0071e3' text-anchor='middle'>= 0.10 m</text><text x='320.0' y='340.0' font-size='28' fill='#0071e3' text-anchor='middle'>只确认了“离目标够近”</text></g></svg>
