<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>把时差换成角度</title><desc id='desc'>8 毫秒乘 90 度每秒得到 0.72 度，在 500 像素焦距的近轴估算中约为 6.3 像素。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='35.0' y='40.0' font-size='28' fill='#1d1d1f' text-anchor='start'>把图像时刻放到 IMU 时间轴</text><text x='35.0' y='110.0' font-size='28' fill='#0071e3' text-anchor='start'>相机</text><text x='35.0' y='232.0' font-size='28' fill='#b05a15' text-anchor='start'>IMU</text><line x1='140.0' y1='122.0' x2='601.0' y2='122.0' stroke='#d2d2d7' stroke-width='3'/><path d='M 601 122 L 590 126.95 L 590 117.05 Z' fill='#d2d2d7'/><line x1='140.0' y1='244.0' x2='601.0' y2='244.0' stroke='#d2d2d7' stroke-width='3'/><path d='M 601 244 L 590 248.95 L 590 239.05 Z' fill='#d2d2d7'/><text x='163.0' y='322.0' font-size='24' fill='#6e6e73' text-anchor='start'>时间向右增加</text><circle cx='225.0' cy='122.0' r='9.0' fill='#0071e3' stroke='none' stroke-width='3'/><circle cx='417.0' cy='244.0' r='9.0' fill='#b05a15' stroke='none' stroke-width='3'/><line x1='235.0' y1='139.0' x2='405.0' y2='224.0' stroke='#0071e3' stroke-width='3'/><path d='M 405 224 L 392.948 223.508 L 397.375 214.653 Z' fill='#0071e3'/><text x='493.0' y='159.0' font-size='30' fill='#0071e3' text-anchor='middle'>0.72°</text><text x='493.0' y='202.0' font-size='28' fill='#b05a15' text-anchor='middle'>≈ 6.3 px</text><text x='225.0' y='86.0' font-size='26' fill='#0071e3' text-anchor='middle'>12.000</text><text x='417.0' y='284.0' font-size='26' fill='#b05a15' text-anchor='middle'>12.008</text></g></svg>
