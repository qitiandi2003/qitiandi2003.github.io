<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>用第二张面拼完整</title><desc id='desc'>ABC与ACD共同覆盖整块板，AC连接两面，外缘各连接一面。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>位置相同，连法携带新的信息</text><path d='M110 100 L290 100 L290 280 Z' stroke='#0071e3' stroke-width='3' fill='#e8f2ff'/><path d='M110 100 L290 280 L110 280 Z' stroke='#267652' stroke-width='3' fill='#e9f5ef'/><line x1='110.0' y1='100.0' x2='290.0' y2='280.0' stroke='#b05a15' stroke-width='5'/><text x='400.0' y='115.0' font-size='28' fill='#b05a15' text-anchor='start'>共用边 AC</text><text x='400.0' y='174.0' font-size='27' fill='#1d1d1f' text-anchor='start'>连接两张面</text><text x='400.0' y='234.0' font-size='27' fill='#267652' text-anchor='start'>总面积 1 m²</text><circle cx='110.0' cy='100.0' r='8.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='83.0' y='90.0' font-size='28' fill='#0071e3' text-anchor='start'>A</text><circle cx='290.0' cy='100.0' r='8.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='306.0' y='90.0' font-size='28' fill='#0071e3' text-anchor='start'>B</text><circle cx='290.0' cy='280.0' r='8.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='306.0' y='298.0' font-size='28' fill='#0071e3' text-anchor='start'>C</text><circle cx='110.0' cy='280.0' r='8.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='83.0' y='298.0' font-size='28' fill='#0071e3' text-anchor='start'>D</text></g></svg>
