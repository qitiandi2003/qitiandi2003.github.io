<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>保留遮挡后的未知</title><desc id='desc'>六格空间中射线命中第4格，前3格获得空闲证据，第5和6格不被更新。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>回波终点后面，仍然没有证据</text><circle cx='35.0' cy='180.0' r='10.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='22.0' y='277.0' font-size='24' fill='#0071e3' text-anchor='start'>雷达</text><rect x='75.0' y='129.0' width='79.0' height='102.0' rx='3' fill='#e9f5ef' stroke='#d2d2d7' stroke-width='2'/><text x='114.0' y='114.0' font-size='25' fill='#6e6e73' text-anchor='middle'>1</text><text x='114.0' y='191.0' font-size='25' fill='#267652' text-anchor='middle'>穿过</text><rect x='162.0' y='129.0' width='79.0' height='102.0' rx='3' fill='#e9f5ef' stroke='#d2d2d7' stroke-width='2'/><text x='201.0' y='114.0' font-size='25' fill='#6e6e73' text-anchor='middle'>2</text><text x='201.0' y='191.0' font-size='25' fill='#267652' text-anchor='middle'>穿过</text><rect x='249.0' y='129.0' width='79.0' height='102.0' rx='3' fill='#e9f5ef' stroke='#d2d2d7' stroke-width='2'/><text x='288.0' y='114.0' font-size='25' fill='#6e6e73' text-anchor='middle'>3</text><text x='288.0' y='191.0' font-size='25' fill='#267652' text-anchor='middle'>穿过</text><rect x='336.0' y='129.0' width='79.0' height='102.0' rx='3' fill='#fff2e4' stroke='#d2d2d7' stroke-width='2'/><text x='375.0' y='114.0' font-size='25' fill='#6e6e73' text-anchor='middle'>4</text><text x='375.0' y='191.0' font-size='25' fill='#b05a15' text-anchor='middle'>命中</text><rect x='423.0' y='129.0' width='79.0' height='102.0' rx='3' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><text x='462.0' y='114.0' font-size='25' fill='#6e6e73' text-anchor='middle'>5</text><text x='462.