<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>两个读数都可能正确</title><desc id='desc'>开始时雷达在0米，墙距离5米；结束时雷达在0.2米，墙距离4.8米。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>把两个时刻的点搬到同一原点</text><line x1='75.0' y1='135.0' x2='540.0' y2='135.0' stroke='#d2d2d7' stroke-width='2'/><line x1='75.0' y1='235.0' x2='540.0' y2='235.0' stroke='#d2d2d7' stroke-width='2'/><line x1='540.0' y1='85.0' x2='540.0' y2='267.0' stroke='#1d1d1f' stroke-width='7'/><text x='558.0' y='185.0' font-size='28' fill='#1d1d1f' text-anchor='start'>墙</text><text x='35.0' y='109.0' font-size='25' fill='#0071e3' text-anchor='start'>开始</text><text x='35.0' y='209.0' font-size='25' fill='#b05a15' text-anchor='start'>结束</text><circle cx='90.0' cy='135.0' r='11.0' fill='#0071e3' stroke='none' stroke-width='3'/><circle cx='108.0' cy='235.0' r='11.0' fill='#b05a15' stroke='none' stroke-width='3'/><line x1='100.0' y1='135.0' x2='530.0' y2='135.0' stroke='#0071e3' stroke-width='3'/><path d='M 530 135 L 519 139.95 L 519 130.05 Z' fill='#0071e3'/><line x1='118.0' y1='235.0' x2='530.0' y2='235.0' stroke='#b05a15' stroke-width='3'/><path d='M 530 235 L 519 239.95 L 519 230.05 Z' fill='#b05a15'/><text x='310.0' y='121.0' font-size='28' fill='#0071e3' text-anchor='middle'>读数 5.00 m</text><text x='310.0' y='220.0' font-size='28' fill='#b05a15' text-anchor='middle'>读数 4.80 m</text><text x='320.0' y='321.0' font-size='28' fill='#1d1d1f' text-anchor='middle'>传感器前进了 0.20 m</text></g></svg>
