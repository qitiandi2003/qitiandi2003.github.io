<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>先认出同一结构</title><desc id='desc'>两幅照片中，近处2米的椅背边和远处4米的墙边，在侧移后分别移动40和20像素。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>近物与远物的移动量不同</text><rect x='55.0' y='75.0' width='245.0' height='205.0' rx='8' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><rect x='340.0' y='75.0' width='245.0' height='205.0' rx='8' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><text x='178.0' y='317.0' font-size='26' fill='#6e6e73' text-anchor='middle'>第一张照片</text><text x='463.0' y='317.0' font-size='26' fill='#6e6e73' text-anchor='middle'>第二张照片</text><line x1='190.0' y1='105.0' x2='190.0' y2='245.0' stroke='#b05a15' stroke-width='10'/><line x1='235.0' y1='115.0' x2='235.0' y2='235.0' stroke='#0071e3' stroke-width='6'/><text x='75.0' y='104.0' font-size='24' fill='#b05a15' text-anchor='start'>椅背 2 m</text><text x='371.0' y='104.0' font-size='24' fill='#0071e3' text-anchor='start'>后墙 4 m</text><line x1='475.0' y1='105.0' x2='475.0' y2='245.0' stroke='#b05a15' stroke-width='10'/><line x1='520.0' y1='115.0' x2='520.0' y2='235.0' stroke='#0071e3' stroke-width='6'/></g></svg>
