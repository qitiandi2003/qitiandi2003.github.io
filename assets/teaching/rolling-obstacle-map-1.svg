<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>椅子仍在走廊里</title><desc id='desc'>第一帧命中第3格；第二种情况射线穿过第3格命中第5格；转开相机则不给第3格新证据。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>看不见了，不等于刚刚测为空闲</text><circle cx='46.0' cy='188.0' r='11.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='24.0' y='296.0' font-size='25' fill='#0071e3' text-anchor='start'>相机</text><rect x='100.0' y='143.0' width='88.0' height='90.0' rx='4' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><text x='144.0' y='125.0' font-size='26' fill='#6e6e73' text-anchor='middle'>1</text><rect x='197.0' y='143.0' width='88.0' height='90.0' rx='4' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><text x='241.0' y='125.0' font-size='26' fill='#6e6e73' text-anchor='middle'>2</text><rect x='294.0' y='143.0' width='88.0' height='90.0' rx='4' fill='#fff2e4' stroke='#d2d2d7' stroke-width='2'/><text x='338.0' y='125.0' font-size='26' fill='#6e6e73' text-anchor='middle'>3</text><rect x='391.0' y='143.0' width='88.0' height='90.0' rx='4' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><text x='435.0' y='125.0' font-size='26' fill='#6e6e73' text-anchor='middle'>4</text><rect x='488.0' y='143.0' width='88.0' height='90.0' rx='4' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><text x='532.0' y='125.0' font-size='26' fill='#6e6e73' text-anchor='middle'>5</text><line x1='60.0' y1='188.0' x2='337.0' y2='188.0' stroke='#0071e3' stroke-width='3'/><path d='M 337 188 L 326 192.95 L 326 183.05 Z' fill='#0071e3'/><circle cx='339.0' cy='188.0' r='10.0' fill='#b05a15' stroke='none' stroke-width='3'/><text x='320.0' y='313.0' font-size='28' fill='#b05a15' text-anchor='middle'>最后命中：第 3 格</text></g></svg>
