<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>换一个错误位置</title><desc id='desc'>参考灰度30、80、140；候选32、78、141平方误差和9，另一候选80、140、175平方误差和7325。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>把一小块纹理按位置逐项比较</text><text x='32.0' y='113.0' font-size='27' fill='#0071e3' text-anchor='start'>参考</text><text x='32.0' y='213.0' font-size='27' fill='#b05a15' text-anchor='start'>候选</text><rect x='150.0' y='72.0' width='85.0' height='62.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='192.0' y='114.0' font-size='30' fill='#0071e3' text-anchor='middle'>30</text><rect x='255.0' y='72.0' width='85.0' height='62.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='297.0' y='114.0' font-size='30' fill='#0071e3' text-anchor='middle'>80</text><rect x='360.0' y='72.0' width='85.0' height='62.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='402.0' y='114.0' font-size='30' fill='#0071e3' text-anchor='middle'>140</text><rect x='150.0' y='172.0' width='85.0' height='62.0' rx='8' fill='#fff2e4' stroke='none' stroke-width='2'/><text x='192.0' y='214.0' font-size='30' fill='#b05a15' text-anchor='middle'>80</text><line x1='192.0' y1='137.0' x2='192.0' y2='165.0' stroke='#6e6e73' stroke-width='2'/><text x='192.0' y='272.0' font-size='27' fill='#b52d39' text-anchor='middle'>50</text><rect x='255.0' y='172.0' width='85.0' height='62.0' rx='8' fill='#fff2e4' stroke='none' stroke-width='2'/><text x='297.0' y='214.0' font-size='30' fill='#b05a15' text-anchor='middle'>140</text><line x1='297.0' y1='137.0' x2='297.0' y2='165.0' stroke='#6e6e73' stroke-width='2'/><text x='297.0' y='272.0' font-size='27' fill='#b52d39' text-anchor='middle'>60</text><rect x='360.0' y='172.0' width='85.0' height='62.0' rx='8' fill='#fff2e4' stroke='none' stroke-width='2'/><text x='402.0' y='214.0' font-size='30' fill='#b05a15' text-anchor='middle'>175</text><line x1='402.0' y1='137.0' x2='402.0' y2='165.0' stroke='#6e6e73' stroke-width='2'/><text x='402.0' y='272.0' font-size='27' fill='#b52d39' text-anchor='middle'>35</text><text x='500.0' y='113.0' font-size='23' fill='#6e6e73' text-anchor='start'>灰度值</text><text x='320.0' y='330.0' font-size='25' fill='#b52d39' text-anchor='middle'>平方误差和：50² + 60² + 35² = 7325</text></g></svg>
