<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>换成 30 再判断</title><desc id='desc'>末段 30 只穿过 /24 的蓝条，不在 /25 的 128 至 255 范围内，因此选择 /24。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='32.0' y='45.0' font-size='28' fill='#1d1d1f' text-anchor='start'>只展开 192.0.2.* 的末段</text><text x='32.0' y='105.0' font-size='30' fill='#0071e3' text-anchor='start'>/24</text><rect x='110.0' y='76.0' width='488.0' height='44.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='32.0' y='190.0' font-size='30' fill='#b05a15' text-anchor='start'>/25</text><rect x='355.0' y='161.0' width='243.0' height='44.0' rx='8' fill='#fff2e4' stroke='none' stroke-width='2'/><text x='110.0' y='248.0' font-size='24' fill='#6e6e73' text-anchor='start'>0</text><text x='354.0' y='248.0' font-size='24' fill='#6e6e73' text-anchor='middle'>128</text><text x='598.0' y='248.0' font-size='24' fill='#6e6e73' text-anchor='end'>255</text><line x1='110.0' y1='226.0' x2='598.0' y2='226.0' stroke='#d2d2d7' stroke-width='3'/><line x1='355.0' y1='70.0' x2='355.0' y2='231.0' stroke='#d2d2d7' stroke-width='2' stroke-dasharray='7 6'/><line x1='167.0' y1='68.0' x2='167.0' y2='227.0' stroke='#1d1d1f' stroke-width='3' stroke-dasharray='7 6'/><circle cx='167.0' cy='98.0' r='8.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='167.0' y='278' font-size='28' fill='#1d1d1f' text-anchor='middle'>目的 30</text><text x='320.0' y='315.0' font-size='30' fill='#0071e3' text-anchor='middle' font-weight='600'>选 /24：/25 不匹配</text></g></svg>
