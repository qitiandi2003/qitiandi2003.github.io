<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>再利用共同后缀</title><desc id='desc'>两条路线都共享相同的起源后缀，可以复用该边界之后的最优分数。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='35.0' y='38.0' font-size='28' fill='#1d1d1f' text-anchor='start'>把局部选择放回整句比较</text><text x='320.0' y='104.0' font-size='32' fill='#1d1d1f' text-anchor='middle'>研究生命起源</text><text x='45.0' y='185.0' font-size='26' fill='#0071e3' text-anchor='start'>路线 A</text><text x='45.0' y='268.0' font-size='26' fill='#b05a15' text-anchor='start'>路线 B</text><rect x='174.0' y='149.0' width='112.0' height='53.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><rect x='302.0' y='149.0' width='112.0' height='53.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><rect x='430.0' y='149.0' width='112.0' height='53.0' rx='8' fill='#f5f5f7' stroke='none' stroke-width='2'/><text x='230.0' y='185.0' font-size='28' fill='#0071e3' text-anchor='middle'>研究</text><text x='358.0' y='185.0' font-size='28' fill='#0071e3' text-anchor='middle'>生命</text><text x='486.0' y='185.0' font-size='28' fill='#6e6e73' text-anchor='middle'>起源</text><rect x='174.0' y='232.0' width='160.0' height='53.0' rx='8' fill='#fff2e4' stroke='none' stroke-width='2'/><rect x='350.0' y='232.0' width='64.0' height='53.0' rx='8' fill='#fff2e4' stroke='none' stroke-width='2'/><rect x='430.0' y='232.0' width='112.0' height='53.0' rx='8' fill='#f5f5f7' stroke='none' stroke-width='2'/><text x='254.0' y='268.0' font-size='28' fill='#b05a15' text-anchor='middle'>研究生</text><text x='382.0' y='268.0' font-size='28' fill='#b05a15' text-anchor='middle'>命</text><text x='486.0' y='268.0' font-size='28' fill='#6e6e73' text-anchor='middle'>起源</text><line x1='174.0' y1='210.0' x2='414.0' y2='210.0' stroke='#0071e3' stroke-width='4'/><text x='320.0' y='337.0' font-size='27' fill='#1d1d1f' text-anchor='middle'>两条路共享同一个“起源”</text><line x1='550.0' y1='175.0' x2='590.0' y2='175.0' stroke='#267652' stroke-width='4'/><line x1='550.0' y1='258.0' x2='590.0' y2='258.0' stroke='#267652' stroke-width='4'/><line x1='590.0' y1='175.0' x2='590.0' y2='258.0' stroke='#267652' stroke-width='4'/></g></svg>
