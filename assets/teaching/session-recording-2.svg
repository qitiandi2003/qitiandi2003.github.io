<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>没有新帧，队列逐渐排空</title><desc id='desc'>约第 5.33 秒，累计采集仍是 100，累计写入约 80，还剩约 20 帧。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><line x1='80.0' y1='300.0' x2='594.0' y2='300.0' stroke='#6e6e73' stroke-width='2'/><path d='M 594 300 L 583 304.95 L 583 295.05 Z' fill='#6e6e73'/><line x1='80.0' y1='300.0' x2='80.0' y2='23.0' stroke='#6e6e73' stroke-width='2'/><path d='M 80 23 L 84.95 34 L 75.05 34 Z' fill='#6e6e73'/><text x='67.0' y='305.0' font-size='22' fill='#6e6e73' text-anchor='end'>0</text><text x='67.0' y='176.0' font-size='22' fill='#6e6e73' text-anchor='end'>50</text><text x='67.0' y='46.0' font-size='22' fill='#6e6e73' text-anchor='end'>100</text><text x='595.0' y='333.0' font-size='23' fill='#6e6e73' text-anchor='end'>秒</text><text x='24' y='105' font-size='22' fill='#6e6e73' text-anchor='start'>帧</text><text x='360.0' y='333.0' font-size='24' fill='#6e6e73' text-anchor='middle'>4</text><text x='547.0' y='333.0' font-size='24' fill='#6e6e73' text-anchor='middle'>6.67</text><line x1='80.0' y1='170.0' x2='577.0' y2='170.0' stroke='#d2d2d7' stroke-width='1' stroke-dasharray='7 6'/><line x1='360.0' y1='42.0' x2='360.0' y2='300.0' stroke='#d2d2d7' stroke-width='2' stroke-dasharray='7 6'/><polyline points='80,300 360,40 547,40 ' fill='none' stroke='#0071e3' stroke-width='4'/><polyline points='80,300 360,144 547,40 ' fill='none' stroke='#b05a15' stroke-width='4'/><line x1='453.0' y1='40.0' x2='453.0' y2='92.0' stroke='#b52d39' stroke-width='5'/><circle cx='453.0' cy='92.0' r='8.0' fill='#b05a15' stroke='none' stroke-width='3'/><text x='461.0' y='135.0' font-size='27' fill='#b52d39' text-anchor='start'>约 20 帧</text><text x='204.0' y='64.0' font-size='26' fill='#0071e3' text-anchor='middle'>停止接收新帧</text><text