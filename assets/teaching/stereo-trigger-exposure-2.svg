<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>分别取中点</title><desc id='desc'>两段曝光的中点分别为 1 和 5 毫秒，相差 4 毫秒。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='35.0' y='40.0' font-size='30' fill='#1d1d1f' text-anchor='start'>同时触发，未必同时观察</text><text x='35.0' y='110.0' font-size='28' fill='#0071e3' text-anchor='start'>左</text><text x='35.0' y='220.0' font-size='28' fill='#b05a15' text-anchor='start'>右</text><line x1='110.0' y1='80.0' x2='110.0' y2='270.0' stroke='#1d1d1f' stroke-width='3' stroke-dasharray='7 6'/><line x1='100.0' y1='280.0' x2='590.0' y2='280.0' stroke='#d2d2d7' stroke-width='3'/><path d='M 590 280 L 579 284.95 L 579 275.05 Z' fill='#d2d2d7'/><text x='110.0' y='315.0' font-size='25' fill='#6e6e73' text-anchor='middle'>0</text><text x='310.0' y='315.0' font-size='25' fill='#6e6e73' text-anchor='middle'>5</text><text x='510.0' y='315.0' font-size='25' fill='#6e6e73' text-anchor='middle'>10 ms</text><rect x='110.0' y='95.0' width='80.0' height='38.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><rect x='110.0' y='205.0' width='400.0' height='38.0' rx='8' fill='#fff2e4' stroke='none' stroke-width='2'/><line x1='150.0' y1='85.0' x2='150.0' y2='146.0' stroke='#0071e3' stroke-width='5'/><line x1='310.0' y1='195.0' x2='310.0' y2='253.0' stroke='#b05a15' stroke-width='5'/><text x='150.0' y='76.0' font-size='26' fill='#0071e3' text-anchor='middle'>1 ms</text><text x='310.0' y='186.0' font-size='26' fill='#b05a15' text-anchor='middle'>5 ms</text><line x1='156.0' y1='159.0' x2='304.0' y2='159.0' stroke='#1d1d1f' stroke-width='3'/><path d='M 304 159 L 293 163.95 L 293 154.05 Z' fill='#1d1d1f'/><text x='230.0' y='147.0' font-size='25' fill='#1d1d1f' text-anchor='middle'>4 ms</text></g></svg>
