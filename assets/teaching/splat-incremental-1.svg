<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>新照片先接上旧坐标</title><desc id='desc'>旧相机A、B已观测地图点P，新相机C通过P等旧路标注册到已有坐标。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>注册照片与增加几何，分成两步</text><circle cx='120.0' cy='288.0' r='11.0' fill='#0071e3' stroke='none' stroke-width='3'/><circle cx='260.0' cy='288.0' r='11.0' fill='#0071e3' stroke='none' stroke-width='3'/><circle cx='410.0' cy='288.0' r='11.0' fill='#b05a15' stroke='none' stroke-width='3'/><circle cx='545.0' cy='288.0' r='11.0' fill='#b05a15' stroke='none' stroke-width='3'/><text x='104.0' y='329.0' font-size='28' fill='#0071e3' text-anchor='start'>A</text><text x='247.0' y='329.0' font-size='28' fill='#0071e3' text-anchor='start'>B</text><text x='397.0' y='329.0' font-size='28' fill='#b05a15' text-anchor='start'>C</text><text x='532.0' y='329.0' font-size='28' fill='#b05a15' text-anchor='start'>D</text><circle cx='220.0' cy='115.0' r='10.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='200.0' y='88.0' font-size='27' fill='#0071e3' text-anchor='start'>旧点 P</text><line x1='120.0' y1='288.0' x2='220.0' y2='115.0' stroke='#0071e3' stroke-width='2'/><line x1='260.0' y1='288.0' x2='220.0' y2='115.0' stroke='#0071e3' stroke-width='2'/><line x1='410.0' y1='288.0' x2='220.0' y2='115.0' stroke='#b05a15' stroke-width='3'/><text x='405.0' y='105.0' font-size='27' fill='#1d1d1f' text-anchor='start'>先定位新相机</text><text x='405.0' y='151.0' font-size='27' fill='#0071e3' text-anchor='start'>P 已经存在</text><text x='405.0' y='213.0' font-size='24' fill='#6e6e73' text-anchor='start'>增加一条观测</text></g></svg>
