<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>按时间确认稳定</title><desc id='desc'>速度降到 0.02 米每秒，其他条件也合格；额外要求保持 0.5 秒后才确认停稳。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><circle cx='360.0' cy='217.0' r='96.0' fill='#e9f5ef' stroke='#267652' stroke-width='3'/><circle cx='360.0' cy='217.0' r='7.0' fill='#267652' stroke='none' stroke-width='3'/><text x='360.0' y='86.0' font-size='27' fill='#267652' text-anchor='middle'>目标 (2.00, 1.00)</text><line x1='360.0' y1='217.0' x2='312.0' y2='217.0' stroke='#d2d2d7' stroke-width='2' stroke-dasharray='7 6'/><line x1='312.0' y1='217.0' x2='312.0' y2='153.0' stroke='#d2d2d7' stroke-width='2' stroke-dasharray='7 6'/><text x='336.0' y='246.0' font-size='23' fill='#6e6e73' text-anchor='middle'>0.06 m</text><text x='297.0' y='188.0' font-size='23' fill='#6e6e73' text-anchor='end'>0.08 m</text><text x='473.0' y='271.0' font-size='24' fill='#267652' text-anchor='start'>容差</text><text x='473.0' y='303.0' font-size='25' fill='#267652' text-anchor='start'>0.12 m</text><circle cx='312.0' cy='153.0' r='11.0' fill='#267652' stroke='none' stroke-width='3'/><line x1='300.0' y1='153.0' x2='285.0' y2='153.0' stroke='#267652' stroke-width='3'/><path d='M 285 153 L 296 148.05 L 296 157.95 Z' fill='#267652'/><text x='135.0' y='77.0' font-size='29' fill='#267652' text-anchor='middle' font-weight='600'>0.02 m/s</text><rect x='36.0' y='198.0' width='190.0' height='50.0' rx='8' fill='#e9f5ef' stroke='none' stroke-width='2'/><text x='131.0' y='232.0' font-size='26' fill='#267652' text-anchor='middle'>全部条件合格</text><line x1='54.0' y1='285.0' x2='208.0' y2='285.0' stroke='#267652' stroke-width='6'/><text x='131.0' y='321.0' font-size='27' fill='#267652' text-anchor='middle'>保持 0.5 s</text><text x='420.0' y='340.0' font-size='29' fill='#267652' text-anchor='middle' font-weight='600'>确认停稳</text></g></svg>
