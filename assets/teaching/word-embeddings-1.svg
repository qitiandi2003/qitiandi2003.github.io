<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>固定这一处窗口</title><desc id='desc'>窗口中心为面条，左右邻居是的与好吃，另外三个词位于本次窗口之外。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='35.0' y='40.0' font-size='28' fill='#1d1d1f' text-anchor='start'>同一个窗口，可以产生不同训练题</text><rect x='28.0' y='73.0' width='89.0' height='60.0' rx='8' fill='#f5f5f7' stroke='none' stroke-width='2'/><text x='72.0' y='113.0' font-size='28' fill='#1d1d1f' text-anchor='middle'>这</text><rect x='127.0' y='73.0' width='89.0' height='60.0' rx='8' fill='#f5f5f7' stroke='none' stroke-width='2'/><text x='171.0' y='113.0' font-size='28' fill='#1d1d1f' text-anchor='middle'>家</text><rect x='226.0' y='73.0' width='89.0' height='60.0' rx='8' fill='#f5f5f7' stroke='none' stroke-width='2'/><text x='270.0' y='113.0' font-size='28' fill='#1d1d1f' text-anchor='middle'>店</text><rect x='325.0' y='73.0' width='89.0' height='60.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='369.0' y='113.0' font-size='28' fill='#1d1d1f' text-anchor='middle'>的</text><rect x='424.0' y='73.0' width='89.0' height='60.0' rx='8' fill='#0071e3' stroke='none' stroke-width='2'/><text x='468.0' y='113.0' font-size='28' fill='#ffffff' text-anchor='middle'>面条</text><rect x='523.0' y='73.0' width='89.0' height='60.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='567.0' y='113.0' font-size='28' fill='#1d1d1f' text-anchor='middle'>好吃</text><line x1='326.0' y1='155.0' x2='620.0' y2='155.0' stroke='#0071e3' stroke-width='4'/><text x='474.0' y='197.0' font-size='27' fill='#0071e3' text-anchor='middle'>一个中心，两个邻居</text><text x='320.0' y='300.0' font-size='28' fill='#6e6e73' text-anchor='middle'>先固定分词与窗口范围</text></g></svg>
