<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>把像素接到地图</title><desc id='desc'>蓝色图像角点与候选位姿的橙色重投影比较，D为大残差候选，绿色E作为未参与求解的检查点。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>一个候选位姿，必须解释多处观测</text><rect x='65.0' y='78.0' width='300.0' height='224.0' rx='5' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><text x='215.0' y='336.0' font-size='26' fill='#6e6e73' text-anchor='middle'>查询照片</text><circle cx='110.0' cy='120.0' r='7.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='122.0' y='109.0' font-size='23' fill='#0071e3' text-anchor='start'>A</text><circle cx='310.0' cy='122.0' r='7.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='322.0' y='111.0' font-size='23' fill='#0071e3' text-anchor='start'>B</text><circle cx='140.0' cy='258.0' r='7.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='152.0' y='247.0' font-size='23' fill='#0071e3' text-anchor='start'>C</text><circle cx='300.0' cy='242.0' r='7.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='312.0' y='231.0' font-size='23' fill='#0071e3' text-anchor='start'>D</text><text x='420.0' y='121.0' font-size='25' fill='#0071e3' text-anchor='start'>蓝点：观测</text><text x='420.0' y='179.0' font-size='26' fill='#1d1d1f' text-anchor='start'>A、B、C、D</text><text x='420.0' y='229.0' font-size='24' fill='#1d1d1f' text-anchor='start'>已连到地图点</text><text x='420.0' y='277.0' font-size='25' fill='#1d1d1f' text-anchor='start'>像素 ↔ 三维</text></g></svg>
