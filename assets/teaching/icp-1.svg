<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>找到三组对应</title><desc id='desc'>二维三个桌角的源点、目标点及共同平移，示例平移为 (0.2,0.1) 米。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>三个桌角一起移动</text><line x1='75.0' y1='275.0' x2='325.0' y2='275.0' stroke='#6e6e73' stroke-width='2'/><path d='M 325 275 L 314 279.95 L 314 270.05 Z' fill='#6e6e73'/><line x1='75.0' y1='275.0' x2='75.0' y2='75.0' stroke='#6e6e73' stroke-width='2'/><path d='M 75 75 L 79.95 86 L 70.05 86 Z' fill='#6e6e73'/><text x='325.0' y='305.0' font-size='24' fill='#6e6e73' text-anchor='start'>x</text><text x='57.0' y='94.0' font-size='24' fill='#6e6e73' text-anchor='start'>y</text><circle cx='120.0' cy='235.0' r='10.0' fill='#ffffff' stroke='#b05a15' stroke-width='3'/><circle cx='100.0' cy='245.0' r='6.0' fill='#0071e3' stroke='none' stroke-width='3'/><line x1='100.0' y1='245.0' x2='120.0' y2='235.0' stroke='#6e6e73' stroke-width='2' stroke-dasharray='7 6'/><circle cx='300.0' cy='235.0' r='10.0' fill='#ffffff' stroke='#b05a15' stroke-width='3'/><circle cx='280.0' cy='245.0' r='6.0' fill='#0071e3' stroke='none' stroke-width='3'/><line x1='280.0' y1='245.0' x2='300.0' y2='235.0' stroke='#6e6e73' stroke-width='2' stroke-dasharray='7 6'/><circle cx='120.0' cy='145.0' r='10.0' fill='#ffffff' stroke='#b05a15' stroke-width='3'/><circle cx='100.0' cy='155.0' r='6.0' fill='#0071e3' stroke='none' stroke-width='3'/><line x1='100.0' y1='155.0' x2='120.0' y2='145.0' stroke='#6e6e73' stroke-width='2' stroke-dasharray='7 6'/><text x='365.0' y='105.0' font-size='26' fill='#0071e3' text-anchor='start'>蓝：源点</text><text x='365.0' y='150.0' font-size='26' fill='#b05a15' text-anchor='start'>橙：目标</text><text x='365.0' y='218.0' font-size='28' fill='#1d1d1f' text-anchor='start'>先找最近邻</text><text x='365.0' y='264.0' font-size='24' fill='#6e6e73' text-anchor='start'>目标保持不动</text></g></svg>
