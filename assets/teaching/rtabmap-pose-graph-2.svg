<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>同样可信时各退一步</title><desc id='desc'>等权最小二乘将中点放在5.0米，两份测量各承担0.1米误差。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>两份测量在争取同一个中点</text><line x1='80.0' y1='240.0' x2='580.0' y2='240.0' stroke='#6e6e73' stroke-width='2'/><path d='M 580 240 L 569 244.95 L 569 235.05 Z' fill='#6e6e73'/><line x1='100.0' y1='232.0' x2='100.0' y2='248.0' stroke='#6e6e73' stroke-width='2'/><text x='100.0' y='282.0' font-size='25' fill='#6e6e73' text-anchor='middle'>4.8</text><line x1='210.0' y1='232.0' x2='210.0' y2='248.0' stroke='#6e6e73' stroke-width='2'/><text x='210.0' y='282.0' font-size='25' fill='#6e6e73' text-anchor='middle'>4.9</text><line x1='320.0' y1='232.0' x2='320.0' y2='248.0' stroke='#6e6e73' stroke-width='2'/><text x='320.0' y='282.0' font-size='25' fill='#6e6e73' text-anchor='middle'>5.0</text><line x1='430.0' y1='232.0' x2='430.0' y2='248.0' stroke='#6e6e73' stroke-width='2'/><text x='430.0' y='282.0' font-size='25' fill='#6e6e73' text-anchor='middle'>5.1</text><line x1='540.0' y1='232.0' x2='540.0' y2='248.0' stroke='#6e6e73' stroke-width='2'/><text x='540.0' y='282.0' font-size='25' fill='#6e6e73' text-anchor='middle'>5.2</text><text x='580.0' y='282.0' font-size='24' fill='#6e6e73' text-anchor='start'>m</text><circle cx='210.0' cy='240.0' r='8.0' fill='#b05a15' stroke='none' stroke-width='3'/><circle cx='430.0' cy='240.0' r='8.0' fill='#0071e3' stroke='none' stroke-width='3'/><circle cx='320.0' cy='240.0' r='12.0' fill='#267652' stroke='none' stroke-width='3'/><line x1='210.0' y1='175.0' x2='311.0' y2='175.0' stroke='#b05a15' stroke-width='3'/><path d='M 311 175 L 300 179.95 L 300 170.05 Z' fill='#b05a15'/><line x1='430.0' y1='175.0' x2='329.0' y2='175.0' stroke='#0071e3' stroke-width='3'/><path d='M 329 175 L 340 170.05 L 340 179.95 Z' fill='#0071e3'/><text x='320.0' y='115.0' font-size='30' fill='#267652' text-anchor='middle'>同样可信：取 5.00 m</text><text x='320.0' y='332.0' font-size='28' fill='#1d1d1f' text-anchor='middle'>(5.1 + 4.9) ÷ 2 = 5.0</text></g></svg>
