<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>换算成米</title><desc id='desc'>同一点依次从模型(0.8,0.3)变为米制(1.6,0.6)，旋转后(-0.6,1.6)，平移后(0.4,-0.4)。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>同一个点，依次改变单位与参考系</text><line x1='105.0' y1='220.0' x2='500.0' y2='220.0' stroke='#6e6e73' stroke-width='2'/><path d='M 500 220 L 489 224.95 L 489 215.05 Z' fill='#6e6e73'/><line x1='320.0' y1='325.0' x2='320.0' y2='65.0' stroke='#6e6e73' stroke-width='2'/><path d='M 320 65 L 324.95 76 L 315.05 76 Z' fill='#6e6e73'/><text x='510.0' y='230.0' font-size='26' fill='#6e6e73' text-anchor='start'>x</text><text x='330.0' y='98.0' font-size='26' fill='#6e6e73' text-anchor='start'>y</text><text x='295.0' y='247.0' font-size='24' fill='#6e6e73' text-anchor='start'>O</text><circle cx='416.0' cy='184.0' r='10.0' fill='#0071e3' stroke='none' stroke-width='3'/><line x1='416.0' y1='184.0' x2='416.0' y2='220.0' stroke='#d2d2d7' stroke-width='2' stroke-dasharray='7 6'/><line x1='416.0' y1='184.0' x2='320.0' y2='184.0' stroke='#d2d2d7' stroke-width='2' stroke-dasharray='7 6'/><text x='320.0' y='340.0' font-size='28' fill='#0071e3' text-anchor='middle'>(1.6, 0.6) m</text><line x1='320.0' y1='220.0' x2='416.0' y2='184.0' stroke='#0071e3' stroke-width='3'/><path d='M 416 184 L 407.438 192.497 L 403.962 183.228 Z' fill='#0071e3'/><text x='38.0' y='100.0' font-size='27' fill='#1d1d1f' text-anchor='start'>乘以尺度 2</text></g></svg>
