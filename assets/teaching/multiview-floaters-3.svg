<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>计算应该分开多少</title><desc id='desc'>同样基线下，1米近点位移30像素、2米墙点15像素，相对差15像素。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>同一条视线，可以藏着不同深度</text><text x='608.0' y='339.0' font-size='22' fill='#6e6e73' text-anchor='end'>射线图不按比例</text><text x='48.0' y='95.0' font-size='29' fill='#1d1d1f' text-anchor='start'>f = 600 px，侧移 0.05 m</text><text x='48.0' y='160.0' font-size='28' fill='#b05a15' text-anchor='start'>近点</text><rect x='153.0' y='133.0' width='360.0' height='36.0' rx='8' fill='#fff2e4' stroke='none' stroke-width='2'/><rect x='153.0' y='133.0' width='300.0' height='36.0' rx='8' fill='#b05a15' stroke='none' stroke-width='2'/><text x='535.0' y='162.0' font-size='26' fill='#b05a15' text-anchor='start'>30 px</text><text x='48.0' y='235.0' font-size='28' fill='#267652' text-anchor='start'>墙点</text><rect x='153.0' y='208.0' width='360.0' height='36.0' rx='8' fill='#e9f5ef' stroke='none' stroke-width='2'/><rect x='153.0' y='208.0' width='150.0' height='36.0' rx='8' fill='#267652' stroke='none' stroke-width='2'/><text x='535.0' y='237.0' font-size='26' fill='#267652' text-anchor='start'>15 px</text><text x='48.0' y='298.0' font-size='29' fill='#1d1d1f' text-anchor='start'>相对位移多出 15 px</text></g></svg>
