<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>只换视差，忘换内参</title><desc id='desc'>误把缩图的 15 像素视差与原焦距 600 混用，深度错误地变成 4 米。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='35.0' y='40.0' font-size='28' fill='#1d1d1f' text-anchor='start'>缩图时，像素焦距也要一起缩</text><text x='130.0' y='100.0' font-size='28' fill='#0071e3' text-anchor='middle'>左图</text><text x='470.0' y='100.0' font-size='28' fill='#b05a15' text-anchor='middle'>右图</text><rect x='35.0' y='120.0' width='250.0' height='130.0' rx='8' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><rect x='355.0' y='120.0' width='250.0' height='130.0' rx='8' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><line x1='200.0' y1='153.0' x2='200.0' y2='180.0' stroke='#0071e3' stroke-width='5'/><line x1='490.0' y1='153.0' x2='490.0' y2='180.0' stroke='#b05a15' stroke-width='5'/><text x='200.0' y='213.0' font-size='28' fill='#0071e3' text-anchor='middle'>175</text><text x='490.0' y='213.0' font-size='28' fill='#b05a15' text-anchor='middle'>160</text><text x='320.0' y='292.0' font-size='30' fill='#b52d39' text-anchor='middle'>600 × 0.10 ÷ 15</text><text x='320.0' y='337.0' font-size='30' fill='#b52d39' text-anchor='middle'>错误：4.00 m</text></g></svg>
