<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>再与角度偏差比较</title><desc id='desc'>近轴条件下，0.2 度旋转误差约造成 2.1 像素偏差，较少依赖深度。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='35.0' y='40.0' font-size='28' fill='#1d1d1f' text-anchor='start'>同样 12 mm，投到图上有多远？</text><text x='35.0' y='94.0' font-size='24' fill='#6e6e73' text-anchor='start'>横向偏移</text><circle cx='76.0' cy='190.0' r='10.0' fill='#1d1d1f' stroke='none' stroke-width='3'/><text x='76.0' y='230.0' font-size='26' fill='#1d1d1f' text-anchor='middle'>相机</text><line x1='88.0' y1='190.0' x2='598.0' y2='190.0' stroke='#d2d2d7' stroke-width='3'/><path d='M 598 190 L 587 194.95 L 587 185.05 Z' fill='#d2d2d7'/><text x='600.0' y='170.0' font-size='26' fill='#6e6e73' text-anchor='middle'>Z</text><line x1='76.0' y1='190.0' x2='560.0' y2='125.0' stroke='#0071e3' stroke-width='3'/><path d='M 176 190 A 100 100 0 0 0 175 177' stroke='#0071e3' stroke-width='4' fill='none'/><text x='226.0' y='151.0' font-size='28' fill='#0071e3' text-anchor='start'>δ = 0.2°</text><circle cx='330.0' cy='156.0' r='7.0' fill='#0071e3' stroke='none' stroke-width='3'/><circle cx='560.0' cy='125.0' r='7.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='330.0' y='230.0' font-size='28' fill='#0071e3' text-anchor='middle'>3 m</text><text x='560.0' y='230.0' font-size='28' fill='#0071e3' text-anchor='middle'>6 m</text><text x='320.0' y='308.0' font-size='30' fill='#0071e3' text-anchor='middle'>两处都约 2.1 px</text></g></svg>
