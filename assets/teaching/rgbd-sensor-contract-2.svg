<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>像素偏移变成比例</title><desc id='desc'>像素偏移 420 减 320 等于 100，100 除以 500 等于 0.2；蓝色射线上的点具有相同 X/Z。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><line x1='80.0' y1='276.0' x2='576.0' y2='276.0' stroke='#6e6e73' stroke-width='2'/><path d='M 576 276 L 565 280.95 L 565 271.05 Z' fill='#6e6e73'/><line x1='80.0' y1='276.0' x2='80.0' y2='76.0' stroke='#6e6e73' stroke-width='2'/><path d='M 80 76 L 84.95 87 L 75.05 87 Z' fill='#6e6e73'/><text x='582.0' y='285.0' font-size='28' fill='#6e6e73' text-anchor='start'>Z</text><text x='70.0' y='64.0' font-size='28' fill='#6e6e73' text-anchor='start'>X</text><circle cx='80.0' cy='276.0' r='8.0' fill='#1d1d1f' stroke='none' stroke-width='3'/><text x='35.0' y='320.0' font-size='28' fill='#1d1d1f' text-anchor='start'>光心</text><line x1='480.0' y1='86.0' x2='480.0' y2='279.0' stroke='#d2d2d7' stroke-width='3' stroke-dasharray='7 6'/><line x1='80.0' y1='276.0' x2='570.0' y2='178.0' stroke='#0071e3' stroke-width='3'/><path d='M 570 178 L 560.184 185.011 L 558.243 175.303 Z' fill='#0071e3'/><text x='310.0' y='48.0' font-size='30' fill='#0071e3' text-anchor='middle' font-weight='600'>X / Z = 100 / 500</text><circle cx='280.0' cy='236.0' r='7.0' fill='#e8f2ff' stroke='#0071e3' stroke-width='3'/><circle cx='480.0' cy='196.0' r='7.0' fill='#e8f2ff' stroke='#0071e3' stroke-width='3'/><text x='290.0' y='132.0' font-size='28' fill='#6e6e73' text-anchor='middle'>同一像素，一条方向</text></g></svg>
