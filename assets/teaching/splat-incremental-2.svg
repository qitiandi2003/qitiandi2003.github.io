<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>两个新机位测出新点</title><desc id='desc'>已定位的新相机C、D通过两条射线交会建立新路标Q。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>注册照片与增加几何，分成两步</text><circle cx='120.0' cy='288.0' r='11.0' fill='#0071e3' stroke='none' stroke-width='3'/><circle cx='260.0' cy='288.0' r='11.0' fill='#0071e3' stroke='none' stroke-width='3'/><circle cx='410.0' cy='288.0' r='11.0' fill='#b05a15' stroke='none' stroke-width='3'/><circle cx='545.0' cy='288.0' r='11.0' fill='#b05a15' stroke='none' stroke-width='3'/><text x='104.0' y='329.0' font-size='28' fill='#0071e3' text-anchor='start'>A</text><text x='247.0' y='329.0' font-size='28' fill='#0071e3' text-anchor='start'>B</text><text x='397.0' y='329.0' font-size='28' fill='#b05a15' text-anchor='start'>C</text><text x='532.0' y='329.0' font-size='28' fill='#b05a15' text-anchor='start'>D</text><circle cx='220.0' cy='115.0' r='10.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='200.0' y='88.0' font-size='27' fill='#0071e3' text-anchor='start'>旧点 P</text><line x1='120.0' y1='288.0' x2='220.0' y2='115.0' stroke='#0071e3' stroke-width='2'/><line x1='260.0' y1='288.0' x2='220.0' y2='115.0' stroke='#0071e3' stroke-width='2'/><circle cx='475.0' cy='145.0' r='10.0' fill='#267652' stroke='none' stroke-width='3'/><line x1='410.0' y1='288.0' x2='475.0' y2='145.0' stroke='#267652' stroke-width='3'/><line x1='545.0' y1='288.0' x2='475.0' y2='145.0' stroke='#267652' stroke-width='3'/><text x='494.0' y='133.0' font-size='26' fill='#267652' text-anchor='start'>新点 Q</text><text x='455.0' y='75.0' font-size='26' fill='#267652' text-anchor='middle'>C、D 共同看见新结构</text></g></svg>
