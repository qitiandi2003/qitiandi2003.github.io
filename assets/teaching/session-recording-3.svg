<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>排空后再完成收尾</title><desc id='desc'>约第 6.67 秒，写入累计达到 100 帧，与采集总量相等；随后仍需完成编码与文件检查。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><line x1='80.0' y1='300.0' x2='594.0' y2='300.0' stroke='#6e6e73' stroke-width='2'/><path d='M 594 300 L 583 304.95 L 583 295.05 Z' fill='#6e6e73'/><line x1='80.0' y1='300.0' x2='80.0' y2='23.0' stroke='#6e6e73' stroke-width='2'/><path d='M 80 23 L 84.95 34 L 75.05 34 Z' fill='#6e6e73'/><text x='67.0' y='305.0' font-size='22' fill='#6e6e73' text-anchor='end'>0</text><text x='67.0' y='176.0' font-size='22' fill='#6e6e73' text-anchor='end'>50</text><text x='67.0' y='46.0' font-size='22' fill='#6e6e73' text-anchor='end'>100</text><text x='595.0' y='333.0' font-size='23' fill='#6e6e73' text-anchor='end'>秒</text><text x='24' y='105' font-size='22' fill='#6e6e73' text-anchor='start'>帧</text><text x='360.0' y='333.0' font-size='24' fill='#6e6e73' text-anchor='middle'>4</text><text x='547.0' y='333.0' font-size='24' fill='#6e6e73' text-anchor='middle'>6.67</text><line x1='80.0' y1='170.0' x2='577.0' y2='170.0' stroke='#d2d2d7' stroke-width='1' stroke-dasharray='7 6'/><line x1='360.0' y1='42.0' x2='360.0' y2='300.0' stroke='#d2d2d7' stroke-width='2' stroke-dasharray='7 6'/><polyline points='80,300 360,40 547,40 ' fill='none' stroke='#0071e3' stroke-width='4'/><polyline points='80,300 360,144 547,40 ' fill='none' stroke='#b05a15' stroke-width='4'/><circle cx='547.0' cy='40.0' r='10.0' fill='#267652' stroke='none' stroke-width='3'/><text x='408' y='250' font-size='28' fill='#267652' text-anchor='middle' font-weight='600'>40 ÷ 15 ≈ 2.67 s</text><text x='408' y='288' font-size='25' fill='#267652' text-anchor='middle'>队列排空后，再验证文件</text></g></svg>
