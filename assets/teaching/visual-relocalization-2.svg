<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>用位姿预测像素</title><desc id='desc'>蓝色图像角点与候选位姿的橙色重投影比较，D为大残差候选，绿色E作为未参与求解的检查点。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>一个候选位姿，必须解释多处观测</text><rect x='65.0' y='78.0' width='300.0' height='224.0' rx='5' fill='#f5f5f7' stroke='#d2d2d7' stroke-width='2'/><text x='215.0' y='336.0' font-size='26' fill='#6e6e73' text-anchor='middle'>查询照片</text><circle cx='110.0' cy='120.0' r='7.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='122.0' y='109.0' font-size='23' fill='#0071e3' text-anchor='start'>A</text><circle cx='117.0' cy='115.0' r='10.0' fill='none' stroke='#b05a15' stroke-width='3'/><line x1='110.0' y1='120.0' x2='117.0' y2='115.0' stroke='#b05a15' stroke-width='2'/><circle cx='310.0' cy='122.0' r='7.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='322.0' y='111.0' font-size='23' fill='#0071e3' text-anchor='start'>B</text><circle cx='317.0' cy='117.0' r='10.0' fill='none' stroke='#b05a15' stroke-width='3'/><line x1='310.0' y1='122.0' x2='317.0' y2='117.0' stroke='#b05a15' stroke-width='2'/><circle cx='140.0' cy='258.0' r='7.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='152.0' y='247.0' font-size='23' fill='#0071e3' text-anchor='start'>C</text><circle cx='147.0' cy='253.0' r='10.0' fill='none' stroke='#b05a15' stroke-width='3'/><line x1='140.0' y1='258.0' x2='147.0' y2='253.0' stroke='#b05a15' stroke-width='2'/><circle cx='300.0' cy='242.0' r='7.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='312.0' y='231.0' font-size='23' fill='#0071e3' text-anchor='start'>D</text><circle cx='335.0' cy='206.0' r='10.0' fill='none' stroke='#b52d39' stroke-width='3'/><line x1='300.0' y1='242.0' x2='335.0' y2='206.0' stroke='#b52d39' stroke-width='2'/><text x='420.0' y='112.0' font-size='25' fill='#b05a15' text-anchor='start'>橙圈：预测</text><text x='420.0' y='167.0' font-size='26' fill='#1d1d1f' text-anchor='start'>多数较接近</text><text x='420.0' y='221.0' font-size='26' fill='#b52d39' text-anchor='start'>D 偏差大</text><text x='420.0' y='275.0' font-size='24' fill='#6e6e73' text-anchor='start'>先检验对应</text></g></svg>
