<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>先看 3 米的点</title><desc id='desc'>深度 3 米处，同样横向 12 毫米误差造成 2.4 像素偏差。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='35.0' y='40.0' font-size='28' fill='#1d1d1f' text-anchor='start'>同样 12 mm，投到图上有多远？</text><text x='35.0' y='94.0' font-size='24' fill='#6e6e73' text-anchor='start'>横向偏移</text><circle cx='76.0' cy='190.0' r='10.0' fill='#1d1d1f' stroke='none' stroke-width='3'/><text x='76.0' y='230.0' font-size='26' fill='#1d1d1f' text-anchor='middle'>相机</text><line x1='88.0' y1='190.0' x2='598.0' y2='190.0' stroke='#d2d2d7' stroke-width='3'/><path d='M 598 190 L 587 194.95 L 587 185.05 Z' fill='#d2d2d7'/><text x='600.0' y='170.0' font-size='26' fill='#6e6e73' text-anchor='middle'>Z</text><circle cx='330.0' cy='190.0' r='8.0' fill='#0071e3' stroke='none' stroke-width='3'/><circle cx='330.0' cy='134.0' r='8.0' fill='#b05a15' stroke='none' stroke-width='3'/><line x1='330.0' y1='190.0' x2='330.0' y2='134.0' stroke='#b05a15' stroke-width='3'/><line x1='76.0' y1='190.0' x2='330.0' y2='134.0' stroke='#b05a15' stroke-width='3'/><text x='330.0' y='110.0' font-size='26' fill='#b05a15' text-anchor='middle'>12 mm</text><text x='330.0' y='230.0' font-size='28' fill='#0071e3' text-anchor='middle'>3 m</text><text x='320.0' y='308.0' font-size='30' fill='#b05a15' text-anchor='middle'>像素偏差 2.4 px</text></g></svg>
