<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>只允许横竖移动</title><desc id='desc'>四邻域路线从(0,0)到(3,4)，三步水平和四步竖直，总长7。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>移动规则改变，最短路也改变</text><line x1='100.0' y1='60.0' x2='100.0' y2='300.0' stroke='#d2d2d7' stroke-width='1'/><line x1='160.0' y1='60.0' x2='160.0' y2='300.0' stroke='#d2d2d7' stroke-width='1'/><line x1='220.0' y1='60.0' x2='220.0' y2='300.0' stroke='#d2d2d7' stroke-width='1'/><line x1='280.0' y1='60.0' x2='280.0' y2='300.0' stroke='#d2d2d7' stroke-width='1'/><line x1='340.0' y1='60.0' x2='340.0' y2='300.0' stroke='#d2d2d7' stroke-width='1'/><line x1='100.0' y1='60.0' x2='340.0' y2='60.0' stroke='#d2d2d7' stroke-width='1'/><line x1='100.0' y1='120.0' x2='340.0' y2='120.0' stroke='#d2d2d7' stroke-width='1'/><line x1='100.0' y1='180.0' x2='340.0' y2='180.0' stroke='#d2d2d7' stroke-width='1'/><line x1='100.0' y1='240.0' x2='340.0' y2='240.0' stroke='#d2d2d7' stroke-width='1'/><line x1='100.0' y1='300.0' x2='340.0' y2='300.0' stroke='#d2d2d7' stroke-width='1'/><circle cx='100.0' cy='300.0' r='9.0' fill='#0071e3' stroke='none' stroke-width='3'/><circle cx='280.0' cy='60.0' r='9.0' fill='#b05a15' stroke='none' stroke-width='3'/><text x='75.0' y='338.0' font-size='24' fill='#0071e3' text-anchor='start'>起点</text><text x='290.0' y='76.0' font-size='24' fill='#b05a15' text-anchor='start'>终点</text><polyline points='100,300 160,300 220,300 280,300 280,240 280,180 280,120 280,60 ' fill='none' stroke='#0071e3' stroke-width='5'/><text x='400.0' y='120.0' font-size='30' fill='#1d1d1f' text-anchor='start'>四邻域</text><text x='400.0' y='172.0' font-size='28' fill='#0071e3' text-anchor='start'>3 + 4 = 7</text><text x='400.0' y='230.0' font-size='24' fill='#6e6e73' text-anchor='start'>每步长度 1</text></g></svg>
