<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>深度把点固定下来</title><desc id='desc'>射线与 Z 等于 2 米平面相交于 X 等于 0.4 米，点坐标为 (0.4,0,2) 米。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><line x1='80.0' y1='276.0' x2='576.0' y2='276.0' stroke='#6e6e73' stroke-width='2'/><path d='M 576 276 L 565 280.95 L 565 271.05 Z' fill='#6e6e73'/><line x1='80.0' y1='276.0' x2='80.0' y2='76.0' stroke='#6e6e73' stroke-width='2'/><path d='M 80 76 L 84.95 87 L 75.05 87 Z' fill='#6e6e73'/><text x='582.0' y='285.0' font-size='28' fill='#6e6e73' text-anchor='start'>Z</text><text x='70.0' y='64.0' font-size='28' fill='#6e6e73' text-anchor='start'>X</text><circle cx='80.0' cy='276.0' r='8.0' fill='#1d1d1f' stroke='none' stroke-width='3'/><text x='35.0' y='320.0' font-size='28' fill='#1d1d1f' text-anchor='start'>光心</text><line x1='480.0' y1='86.0' x2='480.0' y2='279.0' stroke='#d2d2d7' stroke-width='3' stroke-dasharray='7 6'/><line x1='80.0' y1='276.0' x2='480.0' y2='196.0' stroke='#0071e3' stroke-width='3'/><circle cx='480.0' cy='196.0' r='10.0' fill='#0071e3' stroke='none' stroke-width='3'/><line x1='80.0' y1='196.0' x2='480.0' y2='196.0' stroke='#d2d2d7' stroke-width='2' stroke-dasharray='7 6'/><line x1='501.0' y1='276.0' x2='501.0' y2='196.0' stroke='#b05a15' stroke-width='3'/><path d='M 501 196 L 505.95 207 L 496.05 207 Z' fill='#b05a15'/><text x='510.0' y='243.0' font-size='26' fill='#b05a15' text-anchor='start'>0.4 m</text><text x='310.0' y='48.0' font-size='30' fill='#0071e3' text-anchor='middle' font-weight='600'>X = 0.2 × 2 = 0.4 m</text><text x='300.0' y='324.0' font-size='26' fill='#1d1d1f' text-anchor='middle'>Y = 0 时，点为 (0.4, 0, 2) m</text></g></svg>
