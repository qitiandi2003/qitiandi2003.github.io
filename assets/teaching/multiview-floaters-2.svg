<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>保持物体不动，移动相机</title><desc id='desc'>相机侧移到B后，近点与墙点的观察方向分离。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>同一条视线，可以藏着不同深度</text><text x='608.0' y='339.0' font-size='22' fill='#6e6e73' text-anchor='end'>射线图不按比例</text><circle cx='100.0' cy='280.0' r='11.0' fill='#0071e3' stroke='none' stroke-width='3'/><line x1='100.0' y1='280.0' x2='330.0' y2='50.0' stroke='#0071e3' stroke-width='3'/><path d='M 330 50 L 325.722 61.2784 L 318.722 54.278 Z' fill='#0071e3'/><circle cx='200.0' cy='180.0' r='11.0' fill='#b05a15' stroke='none' stroke-width='3'/><circle cx='300.0' cy='80.0' r='11.0' fill='#267652' stroke='none' stroke-width='3'/><text x='48.0' y='322.0' font-size='26' fill='#0071e3' text-anchor='start'>相机 A</text><text x='220.0' y='188.0' font-size='27' fill='#b05a15' text-anchor='start'>近点 1 m</text><text x='322.0' y='89.0' font-size='27' fill='#267652' text-anchor='start'>墙点 2 m</text><text x='415.0' y='242.0' font-size='29' fill='#1d1d1f' text-anchor='start'>A 中重合</text><circle cx='190.0' cy='280.0' r='11.0' fill='#0071e3' stroke='none' stroke-width='3'/><line x1='190.0' y1='280.0' x2='200.0' y2='180.0' stroke='#b05a15' stroke-width='3'/><path d='M 200 180 L 203.831 191.438 L 193.98 190.453 Z' fill='#b05a15'/><line x1='190.0' y1='280.0' x2='300.0' y2='80.0' stroke='#267652' stroke-width='3'/><path d='M 300 80 L 299.036 92.0239 L 290.362 87.2529 Z' fill='#267652'/><text x='165.0' y='322.0' font-size='26' fill='#0071e3' text-anchor='start'>B</text><text x='411.0' y='286.0' font-size='27' fill='#267652' text-anchor='start'>侧移后分开</text></g></svg>
