<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>先画完整曝光区间</title><desc id='desc'>左相机曝光区间为 0 到 2 毫秒，右相机为 0 到 10 毫秒，开始时刻相同。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='35.0' y='40.0' font-size='30' fill='#1d1d1f' text-anchor='start'>同时触发，未必同时观察</text><text x='35.0' y='110.0' font-size='28' fill='#0071e3' text-anchor='start'>左</text><text x='35.0' y='220.0' font-size='28' fill='#b05a15' text-anchor='start'>右</text><line x1='110.0' y1='80.0' x2='110.0' y2='270.0' stroke='#1d1d1f' stroke-width='3' stroke-dasharray='7 6'/><line x1='100.0' y1='280.0' x2='590.0' y2='280.0' stroke='#d2d2d7' stroke-width='3'/><path d='M 590 280 L 579 284.95 L 579 275.05 Z' fill='#d2d2d7'/><text x='110.0' y='315.0' font-size='25' fill='#6e6e73' text-anchor='middle'>0</text><text x='310.0' y='315.0' font-size='25' fill='#6e6e73' text-anchor='middle'>5</text><text x='510.0' y='315.0' font-size='25' fill='#6e6e73' text-anchor='middle'>10 ms</text><rect x='110.0' y='95.0' width='80.0' height='38.0' rx='8' fill='#e8f2ff' stroke='#0071e3' stroke-width='2'/><rect x='110.0' y='205.0' width='400.0' height='38.0' rx='8' fill='#fff2e4' stroke='#b05a15' stroke-width='2'/><text x='195.0' y='125.0' font-size='26' fill='#0071e3' text-anchor='start'>2 ms</text><text x='510.0' y='193.0' font-size='26' fill='#b05a15' text-anchor='end'>10 ms</text></g></svg>
