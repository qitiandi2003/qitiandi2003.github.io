<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>混用原点造成错位</title><desc id='desc'>错误地把5米和4.8米都从扫描结束的同一个原点往前画，早期点落到墙后0.20米，形成墙面错位。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>把两个时刻的点搬到同一原点</text><line x1='75.0' y1='135.0' x2='540.0' y2='135.0' stroke='#d2d2d7' stroke-width='2'/><line x1='75.0' y1='235.0' x2='540.0' y2='235.0' stroke='#d2d2d7' stroke-width='2'/><line x1='540.0' y1='85.0' x2='540.0' y2='267.0' stroke='#1d1d1f' stroke-width='7'/><text x='558.0' y='185.0' font-size='28' fill='#1d1d1f' text-anchor='start'>墙</text><text x='35.0' y='109.0' font-size='25' fill='#0071e3' text-anchor='start'>开始</text><text x='35.0' y='209.0' font-size='25' fill='#b05a15' text-anchor='start'>结束</text><circle cx='108.0' cy='235.0' r='11.0' fill='#b05a15' stroke='none' stroke-width='3'/><circle cx='558.0' cy='135.0' r='9.0' fill='#0071e3' stroke='none' stroke-width='3'/><circle cx='540.0' cy='235.0' r='9.0' fill='#b05a15' stroke='none' stroke-width='3'/><line x1='558.0' y1='135.0' x2='558.0' y2='235.0' stroke='#b52d39' stroke-width='2' stroke-dasharray='7 6'/><text x='310.0' y='121.0' font-size='27' fill='#b52d39' text-anchor='middle'>若误用同一个原点</text><text x='320.0' y='321.0' font-size='28' fill='#b52d39' text-anchor='middle'>同一面墙变成两个位置</text><circle cx='108.0' cy='135.0' r='11.0' fill='#0071e3' stroke='none' stroke-width='3'/></g></svg>
