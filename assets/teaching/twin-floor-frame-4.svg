<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>最后移动原点</title><desc id='desc'>同一点依次从模型(0.8,0.3)变为米制(1.6,0.6)，旋转后(-0.6,1.6)，平移后(0.4,-0.4)。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>同一个点，依次改变单位与参考系</text><line x1='105.0' y1='220.0' x2='500.0' y2='220.0' stroke='#6e6e73' stroke-width='2'/><path d='M 500 220 L 489 224.95 L 489 215.05 Z' fill='#6e6e73'/><line x1='320.0' y1='325.0' x2='320.0' y2='65.0' stroke='#6e6e73' stroke-width='2'/><path d='M 320 65 L 324.95 76 L 315.05 76 Z' fill='#6e6e73'/><text x='510.0' y='230.0' font-size='26' fill='#6e6e73' text-anchor='start'>x</text><text x='330.0' y='98.0' font-size='26' fill='#6e6e73' text-anchor='start'>y</text><text x='295.0' y='247.0' font-size='24' fill='#6e6e73' text-anchor='start'>O</text><circle cx='344.0' cy='244.0' r='10.0' fill='#267652' stroke='none' stroke-width='3'/><line x1='344.0' y1='244.0' x2='344.0' y2='220.0' stroke='#d2d2d7' stroke-width='2' stroke-dasharray='7 6'/><line x1='344.0' y1='244.0' x2='320.0' y2='244.0' stroke='#d2d2d7' stroke-width='2' stroke-dasharray='7 6'/><text x='170.0' y='330.0' font-size='28' fill='#267652' text-anchor='middle'>(0.4, −0.4) m</text><circle cx='380.0' cy='340.0' r='7.0' fill='#b05a15' stroke='none' stroke-width='3'/><line x1='380.0' y1='340.0' x2='344.0' y2='244.0' stroke='#267652' stroke-width='3'/><path d='M 344 244 L 352.497 252.562 L 343.228 256.038 Z' fill='#267652'/><text x='420.0' y='297.0' font-size='24' fill='#b05a15' text-anchor='start'>平移原点</text><text x='38.0' y='100.0' font-size='27' fill='#1d1d1f' text-anchor='start'>加上 (1, −2)</text></g></svg>
