<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>程序成功退出</title><desc id='desc'>进程在退出线结束；带 RemainAfterExit=yes 的单元在其后仍为 active (exited)，结果文件继续存在。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='28.0' y='85.0' font-size='28' fill='#1d1d1f' text-anchor='start'>进程</text><text x='28.0' y='169.0' font-size='28' fill='#1d1d1f' text-anchor='start'>单元</text><text x='28.0' y='253.0' font-size='28' fill='#1d1d1f' text-anchor='start'>文件</text><line x1='142.0' y1='315.0' x2='605.0' y2='315.0' stroke='#6e6e73' stroke-width='2'/><path d='M 605 315 L 594 319.95 L 594 310.05 Z' fill='#6e6e73'/><text x='151.0' y='344.0' font-size='24' fill='#6e6e73' text-anchor='start'>启动</text><text x='395.0' y='344.0' font-size='24' fill='#6e6e73' text-anchor='middle'>退出</text><line x1='395.0' y1='40.0' x2='395.0' y2='290.0' stroke='#d2d2d7' stroke-width='2' stroke-dasharray='7 6'/><rect x='150.0' y='56.0' width='245.0' height='40.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><text x='273.0' y='85.0' font-size='25' fill='#0071e3' text-anchor='middle'>退出码 0</text><rect x='150.0' y='140.0' width='245.0' height='40.0' rx='8' fill='#fff2e4' stroke='none' stroke-width='2'/><rect x='395.0' y='140.0' width='210.0' height='40.0' rx='8' fill='#e9f5ef' stroke='none' stroke-width='2'/><text x='500.0' y='169.0' font-size='28' fill='#267652' text-anchor='middle'>active</text><rect x='265.0' y='224.0' width='340.0' height='40.0' rx='8' fill='#e9f5ef' stroke='none' stroke-width='2'/><text x='465.0' y='253.0' font-size='28' fill='#267652' text-anchor='middle'>文件仍在</text></g></svg>
