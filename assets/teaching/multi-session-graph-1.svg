<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>先比较两点之间的方向</title><desc id='desc'>地图B的标志连线沿正x，地图A的同名连线沿正y，长度同为2。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>同名路标，把两张地图接起来</text><line x1='320.0' y1='60.0' x2='320.0' y2='320.0' stroke='#d2d2d7' stroke-width='3'/><text x='154.0' y='81.0' font-size='29' fill='#0071e3' text-anchor='middle'>地图 B</text><text x='474.0' y='81.0' font-size='29' fill='#b05a15' text-anchor='middle'>地图 A</text><line x1='80.0' y1='275.0' x2='280.0' y2='275.0' stroke='#6e6e73' stroke-width='2'/><path d='M 280 275 L 269 279.95 L 269 270.05 Z' fill='#6e6e73'/><line x1='80.0' y1='275.0' x2='80.0' y2='110.0' stroke='#6e6e73' stroke-width='2'/><path d='M 80 110 L 84.95 121 L 75.05 121 Z' fill='#6e6e73'/><line x1='365.0' y1='295.0' x2='605.0' y2='295.0' stroke='#6e6e73' stroke-width='2'/><path d='M 605 295 L 594 299.95 L 594 290.05 Z' fill='#6e6e73'/><line x1='365.0' y1='295.0' x2='365.0' y2='115.0' stroke='#6e6e73' stroke-width='2'/><path d='M 365 115 L 369.95 126 L 360.05 126 Z' fill='#6e6e73'/><circle cx='525.0' cy='255.0' r='9.0' fill='#ffffff' stroke='#b05a15' stroke-width='3'/><circle cx='525.0' cy='175.0' r='9.0' fill='#ffffff' stroke='#b05a15' stroke-width='3'/><text x='539.0' y='264.0' font-size='22' fill='#b05a15' text-anchor='start'>(4,1)</text><text x='539.0' y='182.0' font-size='22' fill='#b05a15' text-anchor='start'>(4,3)</text><circle cx='100.0' cy='260.0' r='8.0' fill='#0071e3' stroke='none' stroke-width='3'/><circle cx='200.0' cy='260.0' r='8.0' fill='#0071e3' stroke='none' stroke-width='3'/><line x1='100.0' y1='260.0' x2='200.0' y2='260.0' stroke='#0071e3' stroke-width='4'/><text x='99.0' y='232.0' font-size='24' fill='#0071