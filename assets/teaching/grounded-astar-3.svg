<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>比较可用的下界</title><desc id='desc'>直线距离5低于八邻域最短路约5.24；原曼哈顿估计7会高估。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>移动规则改变，最短路也改变</text><line x1='100.0' y1='60.0' x2='100.0' y2='300.0' stroke='#d2d2d7' stroke-width='1'/><line x1='160.0' y1='60.0' x2='160.0' y2='300.0' stroke='#d2d2d7' stroke-width='1'/><line x1='220.0' y1='60.0' x2='220.0' y2='300.0' stroke='#d2d2d7' stroke-width='1'/><line x1='280.0' y1='60.0' x2='280.0' y2='300.0' stroke='#d2d2d7' stroke-width='1'/><line x1='340.0' y1='60.0' x2='340.0' y2='300.0' stroke='#d2d2d7' stroke-width='1'/><line x1='100.0' y1='60.0' x2='340.0' y2='60.0' stroke='#d2d2d7' stroke-width='1'/><line x1='100.0' y1='120.0' x2='340.0' y2='120.0' stroke='#d2d2d7' stroke-width='1'/><line x1='100.0' y1='180.0' x2='340.0' y2='180.0' stroke='#d2d2d7' stroke-width='1'/><line x1='100.0' y1='240.0' x2='340.0' y2='240.0' stroke='#d2d2d7' stroke-width='1'/><line x1='100.0' y1='300.0' x2='340.0' y2='300.0' stroke='#d2d2d7' stroke-width='1'/><circle cx='100.0' cy='300.0' r='9.0' fill='#0071e3' stroke='none' stroke-width='3'/><circle cx='280.0' cy='60.0' r='9.0' fill='#b05a15' stroke='none' stroke-width='3'/><text x='75.0' y='338.0' font-size='24' fill='#0071e3' text-anchor='start'>起点</text><text x='290.0' y='76.0' font-size='24' fill='#b05a15' text-anchor='start'>终点</text><line x1='100.0' y1='300.0' x2='280.0' y2='60.0' stroke='#b05a15' stroke-width='4' stroke-dasharray='7 6'/><text x='400.0' y='102.0' font-size='28' fill='#b05a15' text-anchor='start'>直线距离 5</text><text x='400.0' y='158.0' font-size='28' fill='#1d1d1f' text-anchor='start'>5 ≤ 5.24</text><text x='400.0' y='214.0' font-size='25' fill='#1d1d1f' text-anchor='start'>下界可作启发</text><text x='400.0' y='270.0' font-size='26' fill='#b52d39' text-anchor='start'>7 会高估</text></g></svg>
