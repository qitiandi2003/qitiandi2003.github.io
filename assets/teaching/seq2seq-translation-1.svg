<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>先看这一行权重</title><desc id='desc'>三个源位置向量为 (1,0)、(0,1)、(1,1)，当前注意力权重为 0.1、0.2、0.7。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='35.0' y='38.0' font-size='28' fill='#1d1d1f' text-anchor='start'>三个源位置，合成一个上下文</text><text x='120.0' y='91.0' font-size='28' fill='#0071e3' text-anchor='middle'>Ich</text><text x='320.0' y='91.0' font-size='28' fill='#0071e3' text-anchor='middle'>trinke</text><text x='520.0' y='91.0' font-size='28' fill='#0071e3' text-anchor='middle'>Kaffee</text><rect x='40.0' y='108.0' width='160.0' height='56.0' rx='8' fill='#f5f5f7' stroke='none' stroke-width='2'/><rect x='240.0' y='108.0' width='160.0' height='56.0' rx='8' fill='#f5f5f7' stroke='none' stroke-width='2'/><rect x='440.0' y='108.0' width='160.0' height='56.0' rx='8' fill='#f5f5f7' stroke='none' stroke-width='2'/><text x='120.0' y='145.0' font-size='28' fill='#1d1d1f' text-anchor='middle'>(1, 0)</text><text x='320.0' y='145.0' font-size='28' fill='#1d1d1f' text-anchor='middle'>(0, 1)</text><text x='520.0' y='145.0' font-size='28' fill='#1d1d1f' text-anchor='middle'>(1, 1)</text><rect x='40.0' y='190.0' width='160.0' height='61.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><rect x='240.0' y='190.0' width='160.0' height='61.0' rx='8' fill='#e8f2ff' stroke='none' stroke-width='2'/><rect x='440.0' y='190.0' width='160.0' height='61.0' rx='8' fill='#0071e3' stroke='none' stroke-width='2'/><text x='120.0' y='231.0' font-size='30' fill='#0071e3' text-anchor='middle'>0.1</text><text x='320.0' y='231.0' font-size='30' fill='#0071e3' text-anchor='middle'>0.2</text><text x='520.0' y='231.0' font-size='30' fill='#ffffff' text-anchor='middle'>0.7</text><text x='320.0' y='321.0' font-size='28' fill='#1d1d1f' text-anchor='middle'>0.1 + 0.2 + 0.7 = 1</text></g></svg>
