<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' role='img' aria-labelledby='title desc'><title id='title'>四颗钉子的位置</title><desc id='desc'>正方形四角只有A、B、C、D四个孤立顶点，没有三角面。</desc><rect width='640' height='360' fill='#ffffff'/><g font-family='system-ui, -apple-system, Noto Sans CJK SC, sans-serif' stroke-linecap='round' stroke-linejoin='round'><text x='24.0' y='35.0' font-size='28' fill='#1d1d1f' text-anchor='start' font-weight='600'>位置相同，连法携带新的信息</text><circle cx='110.0' cy='100.0' r='8.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='83.0' y='90.0' font-size='28' fill='#0071e3' text-anchor='start'>A</text><circle cx='290.0' cy='100.0' r='8.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='306.0' y='90.0' font-size='28' fill='#0071e3' text-anchor='start'>B</text><circle cx='290.0' cy='280.0' r='8.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='306.0' y='298.0' font-size='28' fill='#0071e3' text-anchor='start'>C</text><circle cx='110.0' cy='280.0' r='8.0' fill='#0071e3' stroke='none' stroke-width='3'/><text x='83.0' y='298.0' font-size='28' fill='#0071e3' text-anchor='start'>D</text><text x='400.0' y='123.0' font-size='30' fill='#1d1d1f' text-anchor='start'>四个顶点</text><text x='400.0' y='178.0' font-size='28' fill='#6e6e73' text-anchor='start'>尚无表面</text><text x='400.0' y='236.0' font-size='26' fill='#6e6e73' text-anchor='start'>只有坐标</text></g></svg>
